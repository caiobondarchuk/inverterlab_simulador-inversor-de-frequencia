<style>
:root{
  --bg:#f3f5f7; --bg-soft:#ffffff; --panel:#ffffff; --panel-2:#f0f2f5;
  --line:#d7dce2; --line-soft:#e5e9ed;
  --text:#1b222b; --text-dim:#5b6672; --text-faint:#8b95a1;
  --accent:#2f6fed; --accent-dim:#dbe6fd; --accent-strong:#1d54c9;
  --green:#1f9d55; --green-dim:#d9f3e3;
  --red:#d63c3c; --red-dim:#fbdcdc;
  --blue:#2f6fed;
  --mono:'JetBrains Mono', monospace;
  --sans:'Roboto Condensed', sans-serif;
  --radius:3px;
  --canvas-bg:#eef1f4;
  --canvas-dot:#c7cfd8;
}
:root[data-theme="dark"]{
  --bg:#171b21; --bg-soft:#1d232b; --panel:#242b34; --panel-2:#2b3340;
  --line:#39424f; --line-soft:#2e363f;
  --text:#e7ebf0; --text-dim:#9aa5b1; --text-faint:#657080;
  --accent:#4d9fe5; --accent-dim:#1d3a57; --accent-strong:#7cbcf5;
  --green:#3ecf6e; --green-dim:#1f6b3c;
  --red:#e5484d; --red-dim:#7a2226;
  --blue:#4d9fe5;
  --canvas-bg:#171b21;
  --canvas-dot:#333d48;
}
*{box-sizing:border-box;}
#view-bancada{-webkit-user-select:none;user-select:none;}
#view-bancada input,#view-bancada select,#view-bancada textarea{-webkit-user-select:text;user-select:text;}
#ce-svg,#ce-svg *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
button{font-family:var(--sans);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-soft);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

#app{display:flex;flex-direction:column;height:100vh;}

/* ===== TOPO: menu + toolbar ===== */
#menubar{display:flex;align-items:center;gap:2px;background:var(--bg-soft);border-bottom:1px solid var(--line);
  padding:6px 10px;flex-shrink:0;position:relative;z-index:100;}
#brand{display:flex;align-items:center;gap:8px;margin-right:14px;color:var(--accent);font-weight:700;letter-spacing:.02em;}
#brand .logo-nav{height:30px;}
.logo{display:inline-block;aspect-ratio:5.0238;background:var(--logo) no-repeat center/contain;}

.menu-btn:hover{background:var(--panel-2);color:var(--text);}
.menu-btn.active{background:var(--panel-2);color:var(--text);}
.dropdown{position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  min-width:210px;padding:4px;box-shadow:0 8px 24px rgba(20,25,35,.16);display:none;z-index:200;}
:root[data-theme="dark"] .dropdown{box-shadow:0 8px 24px rgba(0,0,0,.4);}
.dropdown.open{display:block;}
.dropdown button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;
  color:var(--text);text-align:left;padding:8px 10px;font-size:12.5px;cursor:pointer;border-radius:var(--radius);}
.dropdown button:hover{background:var(--panel-2);}
.dropdown button:disabled{color:var(--text-faint);cursor:default;}
.dropdown button:disabled:hover{background:none;}
.dropdown .kbd{color:var(--text-faint);font-size:10.5px;font-family:var(--mono);}
.dropdown hr{border:none;border-top:1px solid var(--line);margin:4px 2px;}

#tabbar{display:flex;gap:2px;margin-left:auto;}
.tab-btn{background:none;border:none;color:var(--text-dim);padding:8px 16px;font-size:12.5px;font-weight:600;
  letter-spacing:.03em;cursor:pointer;border-radius:var(--radius);display:flex;align-items:center;gap:6px;}
.tab-btn svg{width:15px;height:15px;opacity:.7;}
.tab-btn:hover{background:var(--panel-2);color:var(--text);}
.tab-btn.active{background:var(--accent-dim);color:var(--accent-strong);}
.tab-btn.active svg{opacity:1;}

#theme-toggle{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
  padding:6px 10px;font-size:11px;font-weight:600;border-radius:var(--radius);cursor:pointer;margin-left:8px;}
#theme-toggle:hover{color:var(--text);}
#lang-toggle{display:flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);padding:6px 10px;font-size:11px;font-weight:600;border-radius:var(--radius);cursor:pointer;margin-left:auto;margin-right:10px;}
#lang-toggle:hover{color:var(--text);} #lang-toggle svg{width:14px;height:14px;} #lang-toggle .lg{opacity:.45;} #lang-toggle .lg.on{opacity:1;color:var(--accent);font-weight:800;} #lang-toggle .sep{opacity:.4;}
#theme-toggle svg{width:14px;height:14px;}

/* ===== toolbar de ações rápidas ===== */
#quickbar{display:flex;align-items:center;gap:4px;background:var(--bg-soft);border-bottom:1px solid var(--line);
  padding:5px 10px;flex-shrink:0;overflow-x:auto;}
.qbtn{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
  padding:6px 10px;font-size:11.5px;font-weight:600;border-radius:var(--radius);cursor:pointer;white-space:nowrap;}
.qbtn:hover{background:var(--panel-2);color:var(--text);border-color:var(--text-faint);}
.qbtn.primary{background:var(--accent);border-color:var(--accent-strong);color:#fff;}
.qbtn.primary:hover{background:var(--accent-strong);}
.qbtn.danger{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.qbtn.danger:hover{filter:brightness(0.95);}
.qbtn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-strong);}
.qbtn svg{width:13px;height:13px;}
.qsep{width:1px;height:20px;background:var(--line);margin:0 4px;}
.qspacer{flex:1;}
#runstate{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text-dim);padding:0 8px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);}
.dot.run{background:var(--green);box-shadow:0 0 6px var(--green);}
.dot.fault{background:var(--red);box-shadow:0 0 6px var(--red);}

/* ===== corpo principal ===== */
#body{flex:1;display:flex;overflow:hidden;min-height:0;}
.view{display:none;flex:1;overflow:hidden;min-height:0;}
.view.active{display:flex;}

/* ---- toast / dialogs ---- */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:6px;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);color:var(--text);
  padding:9px 14px;border-radius:var(--radius);font-size:12.5px;box-shadow:0 6px 20px rgba(20,25,35,.18);max-width:420px;
  animation:toastin .18s ease-out;}
:root[data-theme="dark"] .toast{box-shadow:0 6px 20px rgba(0,0,0,.4);}
.toast.warn{border-left-color:#d69420;}
.toast.error{border-left-color:var(--red);}
.toast.ok{border-left-color:var(--green);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.modal-backdrop{position:fixed;inset:0;background:rgba(30,35,45,.45);display:none;align-items:center;justify-content:center;
  z-index:800;padding:20px;}
:root[data-theme="dark"] .modal-backdrop{background:rgba(10,12,15,.72);}
.modal-backdrop.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:640px;width:100%;max-height:86vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(20,25,35,.25);}
:root[data-theme="dark"] .modal{box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);}
#manual-backdrop{z-index:760;}
#manual-modal{max-width:1100px;width:min(1100px,calc(100vw - 56px));height:min(80vh,720px);max-height:80vh;}
#mi-close{background:none;border:1px solid #3b4654;color:#8b9bb0;border-radius:3px;width:20px;height:20px;line-height:1;cursor:pointer;padding:0;flex-shrink:0;font-size:13px;font-family:var(--sans);}
#mi-close:hover{color:#fff;background:rgba(255,255,255,.07);}
#ce-palette{transition:width .18s ease,opacity .18s ease;overflow-x:hidden;}
#ce-palette.collapsed{width:0 !important;opacity:0;border-right:0;overflow:hidden;pointer-events:none;}
#pal-collapse{background:none;border:1px solid var(--line);color:var(--text-faint);border-radius:3px;width:20px;height:20px;line-height:1;
  cursor:pointer;font-size:14px;padding:0;flex-shrink:0;}
#pal-collapse:hover{color:var(--text);background:var(--panel-2);}
#palette-tab{display:none;align-items:center;justify-content:center;position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:7;
  writing-mode:vertical-rl;background:var(--bg-soft);border:1px solid var(--line);border-left:none;border-radius:0 6px 6px 0;
  padding:12px 5px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-dim);cursor:pointer;font-family:var(--sans);}
#palette-tab:hover{background:var(--panel-2);color:var(--text);}
#mi-tab{display:none;align-items:center;justify-content:center;position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:7;
  writing-mode:vertical-rl;background:var(--bg-soft);border:1px solid var(--line);border-right:none;border-radius:6px 0 0 6px;
  padding:12px 5px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-dim);cursor:pointer;font-family:var(--sans);}
#mi-tab:hover{background:var(--panel-2);color:var(--text);}

input[type=text], input[type=number], select, textarea{
  background:var(--bg-soft);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:var(--radius);
  font-family:var(--sans);font-size:12.5px;width:100%;}
input:focus, select:focus, textarea:focus{outline:1px solid var(--accent);border-color:var(--accent);}
label.field{display:block;margin-bottom:10px;}
label.field .lbl{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;letter-spacing:.02em;}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:var(--radius);
  font-size:12.5px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--panel-2);}
.btn.primary{background:var(--accent);border-color:var(--accent-strong);color:#fff;}
.btn.primary:hover{background:var(--accent-strong);}

a{color:var(--blue);}
::selection{background:var(--accent-dim);}
</style>
</head>

<script>
// ============================================================
// BASE DE PARÂMETROS — baseada no Manual do Usuário AD600M (Rev. B) e no Guia de Aplicação Rápida
// Estrutura: grupos -> lista de parâmetros
// alt: '★' só parado | '☆' parado ou rodando | '○' fábrica | '●' leitura
// ============================================================
const PARAM_GROUPS = [
  {id:"P0", name:"Funções Básicas", color:"#4d9fe5"},
  {id:"P1", name:"Controle de Partida e Parada", color:"#4d9fe5"},
  {id:"P2", name:"Parâmetros de Controle V/F", color:"#4d9fe5"},
  {id:"P3", name:"Parâmetros de Controle Vetorial", color:"#4d9fe5"},
  {id:"P4", name:"Parâmetros do Primeiro Motor", color:"#4d9fe5"},
  {id:"P5", name:"Terminais de Entrada", color:"#a78bfa"},
  {id:"P6", name:"Terminais de Saída", color:"#a78bfa"},
  {id:"P7", name:"Acessibilidade e Display do Teclado", color:"#3ecf6e"},
  {id:"P8", name:"Parâmetros de Comunicação", color:"#3ecf6e"},
  {id:"P9", name:"Falhas e Proteção", color:"#e5484d"},
  {id:"PA", name:"Função PID", color:"#f0a020"},
  {id:"Pb", name:"Oscilação, Comprimento Fixo e Contagem", color:"#f0a020"},
  {id:"PC", name:"Multissegmento e PLC Simples", color:"#f0a020"},
  {id:"PD", name:"Controle de Torque", color:"#f0a020"},
  {id:"PE", name:"Curvas Multiponto de AI", color:"#f0a020"},
  {id:"PF", name:"Parâmetros do Fabricante", color:"#657080"},
  {id:"A0", name:"Segundo Motor — Ajuste", color:"#f0a020"},
  {id:"A1", name:"Segundo Motor — Parâmetros", color:"#f0a020"},
  {id:"A2", name:"Segundo Motor — V/F", color:"#f0a020"},
  {id:"A3", name:"Segundo Motor — Controle Vetorial", color:"#f0a020"},
  {id:"B0", name:"Parâmetros do Sistema", color:"#657080"},
  {id:"B1", name:"Personalização de Códigos de Função", color:"#657080"},
  {id:"B2", name:"Otimização do Controle", color:"#657080"},
  {id:"B3", name:"Correção AI/AO", color:"#657080"},
  {id:"B4", name:"Controle Mestre-Escravo", color:"#657080"},
  {id:"B5", name:"Função de Freio", color:"#657080"},
  {id:"B6", name:"Sleep / Wake-up", color:"#657080"},
  {id:"U0", name:"Registro de Falhas", color:"#e5484d"},
  {id:"U1", name:"Monitoramento de Aplicação", color:"#3ecf6e"}
];
// Cada parâmetro: {code, name, min, max, step, def, unit, alt, enum, desc} — fonte: Manual AD600M (Rev. B) e Guia de Aplicação Rápida
const PARAMS = {};
function P(code, name, def, opts){
  opts = opts||{};
  PARAMS[code] = Object.assign({code, name, def, val: def,
    min: opts.min ?? null, max: opts.max ?? null, step: opts.step ?? 1,
    unit: opts.unit || '', alt: opts.alt || '☆', enum: opts.enum || null,
    desc: opts.desc || '', decimals: opts.decimals ?? 0, readonly: opts.readonly || false
  }, opts, {val: def});
}

/* ---- P0 ---- */
P("P0-00","Número do produto",0,{"alt": "●", "min": 0, "max": 99999, "step": 1, "decimals": 0, "desc": "Parâmetro composto por dígitos (unidade, dezena, centena…). Consulte o manual para o significado de cada dígito.", "readonly": true});
P("P0-01","Exibição do tipo G/P do inversor",0.0,{"alt": "★", "enum": [{"v": 0, "l": "Tipo G"}, {"v": 1, "l": "Tipo P"}]});
P("P0-02","Corrente nominal",3.8,{"alt": "●", "unit": "A", "min": 0.1, "max": 3000.0, "step": 1, "decimals": 0, "readonly": true});
P("P0-03","Método de controle do motor",2.0,{"alt": "★", "enum": [{"v": 1, "l": "Vetorial de malha aberta — motor assíncrono"}, {"v": 2, "l": "Controle V/F — motor assíncrono"}, {"v": 11, "l": "Vetorial de malha aberta — motor síncrono"}, {"v": 12, "l": "Controle V/F — motor síncrono"}]});
P("P0-04","Fonte do comando de operação",0.0,{"alt": "★", "enum": [{"v": 0, "l": "Comando pelo painel de operação (LED apagado)"}, {"v": 1, "l": "Comando por terminais (LED aceso)"}, {"v": 2, "l": "Comando por comunicação (LED piscando)"}]});
P("P0-05","Referência das teclas ▲/▼ durante a operação",1.0,{"alt": "★", "enum": [{"v": 0, "l": "Frequência de operação"}, {"v": 1, "l": "Frequência ajustada"}]});
P("P0-06","Seleção da fonte de frequência principal X",1.0,{"alt": "★", "enum": [{"v": 0, "l": "Ajuste ▲/▼ da frequência, sem memória ao desligar"}, {"v": 1, "l": "Ajuste ▲/▼ da frequência, com memória de queda de energia"}, {"v": 2, "l": "AI1"}, {"v": 3, "l": "Reservado"}, {"v": 4, "l": "Multivelocidade"}, {"v": 5, "l": "PLC simples"}, {"v": 6, "l": "PID"}, {"v": 7, "l": "Controle por comunicação"}, {"v": 8, "l": "Pulsos"}, {"v": 9, "l": "Ajuste ▲/▼ da frequência, memória ao parar, memória de queda de energia, sem memória"}]});
P("P0-07","Seleção da fonte de frequência auxiliar Y",0.0,{"alt": "★", "enum": [{"v": 0, "l": "Ajuste ▲/▼ da frequência, sem memória ao desligar"}, {"v": 1, "l": "Ajuste ▲/▼ da frequência, com memória de queda de energia"}, {"v": 2, "l": "AI1"}, {"v": 3, "l": "Reservado"}, {"v": 4, "l": "Multivelocidade"}, {"v": 5, "l": "PLC simples"}, {"v": 6, "l": "PID"}, {"v": 7, "l": "Controle por comunicação"}, {"v": 8, "l": "Pulsos"}, {"v": 9, "l": "Ajuste ▲/▼ da frequência, memória ao parar, memória de queda de energia, sem memória"}]});
P("P0-08","Seleção da faixa da fonte auxiliar Y",0.0,{"alt": "☆", "enum": [{"v": 0, "l": "Relativa à frequência máxima"}, {"v": 1, "l": "Relativa à fonte de frequência X"}, {"v": 2, "l": "Faixa igual a 0, mas principal e auxiliar sem frequência negativa"}]});
P("P0-09","Faixa da fonte auxiliar Y",100.0,{"alt": "☆", "unit": "%", "min": 0.0, "max": 100.0, "step": 1, "decimals": 0});
P("P0-10","Seleção da fonte de frequência",0.0,{"alt": "☆", "min": 0, "max": 99999, "step": 1, "decimals": 0, "desc": "Parâmetro composto por dígitos (unidade, dezena, centena…). Consulte o manual para o significado de cada dígito."});
P("P0-11","Frequência pré-ajustada",50.0,{"alt": "☆", "unit": "Hz", "min": 0.0, "max": 600, "step": 0.01, "decimals": 2, "desc": "Faixa: 0,00 Hz até a frequência máxima (P0-14). O número de casas decimais acompanha P0-20."});
P("P0-13","Seleção do sentido de rotação do motor",0.0,{"alt": "☆", "enum": [{"v": 0, "l": "Igual ao sentido atual do motor"}, {"v": 1, "l": "Oposto ao sentido atual do motor"}, {"v": 2, "l": "Inversão proibida"}]});
P("P0-14","Frequência máxima de saída",50.0,{"alt": "★", "unit": "Hz", "min": 50, "max": 600, "step": 0.01, "decimals": 2, "desc": "Faixa conforme P0-20: com P0-20=1, 50,0 a 1200,0 Hz; com P0-20=2, 50,00 a 600,00 Hz."});
P("P0-15","Fonte do limite superior de frequência",0.0,{"alt": "★", "enum": [{"v": 0, "l": "Parâmetro (P0-16)"}, {"v": 1, "l": "AI1"}, {"v": 2, "l": "Reservado"}, {"v": 3, "l": "Controle por comunicação"}, {"v": 4, "l": "Pulsos"}]});

// P0-20 define as casas decimais e a faixa de P0-14; P0-21 define a faixa
// dos tempos de rampa; P5-15/P5-17 são mutuamente dependentes.
function clampParamValue(p){
  if(!p || p.enum) return;
  if(p.min!=null && p.val<p.min) p.val=p.min;
  if(p.max!=null && p.val>p.max) p.val=p.max;
  if(p.decimals!=null){
    const f=Math.pow(10,p.decimals);
    p.val=Math.round(p.val*f)/f;
  }
}
function applyDynamicRanges(){
  const dec = PARAMS['P0-20'].val===1 ? 1 : 2;
  const fmax = dec===1 ? 1200 : 600;
  const fp = PARAMS['P0-14'];
  fp.min=50; fp.max=fmax; fp.decimals=dec; fp.step=dec===1?0.1:0.01;
  clampParamValue(fp);

  const preset=PARAMS['P0-11'];
  preset.max=fp.val; preset.decimals=dec; preset.step=fp.step;
  clampParamValue(preset);

  const upper=PARAMS['P0-16'], offset=PARAMS['P0-17'], lower=PARAMS['P0-18'];
  upper.min=lower.val; upper.max=fp.val; upper.decimals=dec; upper.step=fp.step;
  clampParamValue(upper);
  offset.max=fp.val; offset.decimals=dec; offset.step=fp.step;
  clampParamValue(offset);
  lower.max=upper.val; lower.decimals=dec; lower.step=fp.step;
  clampParamValue(lower);

  const unit=PARAMS['P0-21'].val;
  const ramp = unit===0 ? {max:30000,step:1,dec:0} : unit===1 ? {max:3000,step:0.1,dec:1} : {max:300,step:0.01,dec:2};
  ['P0-23','P0-24'].forEach(c=>{
    const p=PARAMS[c]; p.max=ramp.max; p.step=ramp.step; p.decimals=ramp.dec;
    clampParamValue(p);
  });

  const aiMin=PARAMS['P5-15'], aiMax=PARAMS['P5-17'];
  aiMax.min=aiMin.val; aiMax.max=10; aiMax.step=0.01; aiMax.decimals=2;
  clampParamValue(aiMax);
  aiMin.max=aiMax.val; aiMin.step=0.01; aiMin.decimals=2;
  clampParamValue(aiMin);

  ['P1-14','P2-02','P2-03','P2-05','P2-07','P3-00','P3-02','P4-05','P7-43','P7-53','P7-54','P7-55','P7-57'].forEach(c=>{
    const p=PARAMS[c];
    if(!p || p.enum) return;
    p.max=fp.val; p.decimals=dec; p.step=fp.step;
    clampParamValue(p);
  });
}
applyDynamicRanges();

<script>
// ============================================================
// MOTOR DE SIMULAÇÃO ELÉTRICA
// Modela: fonte de alimentação -> circuito de comando (botoeiras,
// contatores, CLP) -> inversor AD600M -> motor de indução trifásico
// Inclui: modelo V/F com escorregamento, corrente estimada por
// curva de carga típica, térmica simplificada, curto-circuito e
// polaridade de DI (NPN/PNP), abertura de circuito.
// ============================================================

class MotorModel {
  constructor(params){
    this.updateFromParams(params);
    this.rpmActual = 0;      // rpm mecânico atual (com inércia)
    this.tempC = 25;         // temperatura estimada do motor (proteção térmica simplificada)
    this.running = false;
  }
  updateFromParams(P){
    this.kw   = P['P4-01'].val;       // potência nominal
    this.vNom = P['P4-02'].val;       // tensão nominal
    this.poles = P['P4-03'].val;      // número de polos
    this.iNom = P['P4-04'].val;       // corrente nominal
    this.fNom = P['P4-05'].val;       // frequência nominal
    this.rpmNom = P['P4-06'].val;     // velocidade nominal
    this.i0 = P['P4-07'].val;         // corrente a vazio
    this.fp = P['M-FP'].val;
    this.eff = P['M-EFF'].val/100;
    this.rpmSync = 120*this.fNom/this.poles;
  }
  // Corrente estimada em função da carga mecânica (0-150%) e frequência
  // Usa modelo simplificado: corrente magnetizante (~30% Inom) + componente de carga
  estimateCurrent(freqHz, loadPct, vfMode){
    if(freqHz <= 0.01) return 0;
    const freqRatio = Math.min(freqHz/this.fNom, 1.3);
    const imag = (this.i0||this.iNom*0.30)*Math.min(1, freqHz/ (this.fNom*0.2 + 0.01)); // cai em baixa freq com V/F
    const iLoad = this.iNom*(loadPct/100);
    // Em baixas frequências com V/F linear, torque cai -> mais escorregamento para mesma carga -> mais corrente
    const lowFreqPenalty = freqHz < (this.fNom*0.15) ? 1.35 : 1.0;
    let i = Math.sqrt(imag*imag + (iLoad*lowFreqPenalty)*(iLoad*lowFreqPenalty));
    return Math.min(i, this.iNom*2.2);
  }
  // Escorregamento nominal aproximado
  slipNom(){ return (this.rpmSync-this.rpmNom)/this.rpmSync; }
  targetRpm(freqHz, loadPct){
    const syncRpm = 120*freqHz/this.poles;
    const slip = this.slipNom()*(0.4+0.6*(loadPct/100)); // carga leve desliza menos
    return Math.max(0, syncRpm*(1-slip));
  }
}

class InverterEngine {
  constructor(getParam){
    this.getParam = getParam; // fn(code) -> {val,...}
    this.freqRef = 0;      // Hz — referência calculada
    this.freqOut = 0;      // Hz — saída real (rampa aplicada)
    this.vdc = 0;           // V barramento CC
    this.vout = 0;
    this.iout = 0;
    this.power = 0;
    this.state = 'STOPPED'; // STOPPED | ACCEL | RUN | DECEL | FAULT
    this.direction = 1;     // 1 FWD, -1 REV
    this.fault = null;
    this.runCmd = false;
    this.di = {DI1:false,DI2:false,DI3:false,DI4:false,DI5:false,DI6:false};
    this.ai1Volts = 0;      // 0-10V simulando potenciômetro
    this.loadPct = 30;      // carga mecânica no eixo (%), definido pelo tipo de carga conectada
    this.jogActive = false;
    this.tSinceEnergized = 0;
    this._faultLatch = null;
    this._fwdPrev = false;
    this._revPrev = false;
    this._threeWireLatch = false;
    this.relayOn = false;
    this.powered = false;
    this.dirEff = 1;
  }

  pval(code){ const p=this.getParam(code); return p? p.val : 0; }

  // função atribuída a cada terminal DI (P5-00..P5-03 -> DI1..DI4)
  dif(fn){ return ['DI1','DI2','DI3','DI4'].some((d,i)=> this.di[d] && this.pval('P5-0'+i)===fn); }
  fnActive(fn){ return ['DI1','DI2','DI3','DI4'].some((d,i)=> this.di[d] && this.pval('P5-0'+i)===fn); }
  multiIndex(){ let idx=0; [12,13,14,15].forEach((fn,b)=>{ if(this.dif(fn)) idx|=(1<<b); }); return idx; }
  // Converte a tensão de AI1 (0–10 V) em porcentagem conforme P5-15..P5-18.
  ai1Percent(){
    const v=this.ai1Volts;
    const vmin=this.pval('P5-15'), vmax=this.pval('P5-17');
    const pmin=this.pval('P5-16'), pmax=this.pval('P5-18');
    if(vmax<=vmin) return pmax;
    let t=(v-vmin)/(vmax-vmin);
    t=Math.max(0,Math.min(1,t));
    return pmin + t*(pmax-pmin);
  }

  // calcula a frequência de referência com base na fonte selecionada (P0-06)
  computeFreqRef(){
    const src = this.pval('P0-06');
    const fmax = this.pval('P0-14');
    const fup = Math.min(fmax, this.pval('P0-15')===0 ? this.pval('P0-16') : fmax);   // limite superior (P0-15/P0-16)
    const fmin = this.pval('P0-18');
    let f = 0;
    if(this.jogActive) f = this.pval('P7-00');                                         // JOG (P7-00)
    else if(src===2) f = Math.max(0,this.ai1Percent())/100*fmax;                       // AI1 com escala P5-15..P5-18
    else if(src===4) f = Math.abs(this.pval('PC-'+String(this.multiIndex()).padStart(2,'0')))/100*fmax;  // multivelocidade (PC-00..PC-15, % de P0-14)
    else f = this.pval('P0-11');                                                       // ajuste digital ▲/▼ (frequência pré-ajustada)
    f = Math.min(Math.max(f, 0), fup);
    if(f>0 && f<fmin) f = fmin;
    return f;
  }

  // Comando RUN conforme a fonte configurada (P0-04) e as funções dos terminais DI (P5-00..P5-03)
  evaluateRunCommand(){
    const src = this.pval('P0-04');
    // reset de falha por terminal (borda de subida)
    const rst = this.dif(9);
    if(rst && !this._rstPrev && this.fault) this.clearFault();
    this._rstPrev = rst;
    // falha externa (11: NA / 27: NF)
    if(!this.fault && this.state!=='FAULT'){
      const nf = ['DI1','DI2','DI3','DI4'].some((d,i)=> this.pval('P5-0'+i)===27 && !this.di[d]);
      if(this.dif(11) || nf) this.triggerFault(28,'Err28 — Falha externa');
    }
    this.jogActive = false;
    if(src===1){ // terminais
      const fwd=this.dif(1), rev=this.dif(2), fj=this.dif(4), rj=this.dif(5), mode=this.pval('P5-11');
      const fwdEdge=fwd&&!this._fwdPrev, revEdge=rev&&!this._revPrev;
      let run=false, dir=this.direction||1;
      if(fj||rj){ this.jogActive=true; run=true; dir=fj?1:-1; }
      else if(mode===2 || mode===3){
        // Três fios: um DI com função 3 é a parada. Tipo 1 usa contato NF
        // (abre para parar); tipo 2 usa contato NA (fecha para parar).
        const stopInput=this.fnActive(3);
        const stopped = mode===2 ? !stopInput : stopInput;
        if(stopped || (fwd&&rev)) this._threeWireLatch=false;
        if(fwdEdge && !rev){ this._threeWireLatch=true; this.direction=1; }
        if(revEdge && !fwd){ this._threeWireLatch=true; this.direction=-1; }
        run=this._threeWireLatch; dir=this.direction;
      }
      else if(mode===1){ run=fwd; dir=rev?-1:1; }                        // dois fios tipo 2: FWD = habilita, REV = sentido
      else if(fwd&&!rev){ run=true; dir=1; }                              // dois fios tipo 1
      else if(rev&&!fwd){ run=true; dir=-1; }
      if(this.dif(8)||this.dif(10)){ run=false; this._threeWireLatch=false; } // parada livre / pausa de operação
      this.runCmd=run; if(run) this.direction=dir;
    }
    this._fwdPrev=this.dif(1); this._revPrev=this.dif(2);
    // src 0 (painel) e 2 (comunicação) são controlados externamente via IHM (setRunFromPanel)
  }

  setRunFromPanel(run, dir){
    if(this.pval('P0-04')===0){ this.runCmd = run; if(dir) this.direction = dir; }
  }

  triggerFault(code, msg){
    this.state='FAULT'; this.fault={code,msg}; this.runCmd=false;
    if(window.__onInvFault) window.__onInvFault(this, code);
  }
  // saída a relé TA/TB/TC conforme P6-00
  updateRelay(){
    const f=this.pval('P6-00'), run=this.runCmd||this.freqOut>0.01;
    const upper=Math.min(this.pval('P0-14'), this.pval('P0-15')===0?this.pval('P0-16'):this.pval('P0-14'));
    const lower=this.pval('P0-18');
    let on=false;
    switch(f){
      case 1: on=run; break;                                                        // inversor em operação
      case 2: case 45: on=!!this.fault; break;                                      // saída de falha
      case 4: on=this.runCmd && this.freqOut>0.01 && Math.abs(this.freqOut-this.freqRef)<0.5; break;  // frequência atingida
      case 5: on=this.runCmd && this.freqOut<0.01; break;                           // operando em velocidade zero
      case 11: on=!!this.powered && !this.fault; break;                             // pronto para operar
      case 13: on=this.runCmd && this.freqOut>=upper-0.01; break;                   // limite superior atingido
      case 14: on=this.runCmd && this.freqOut<=lower+0.01; break;                   // limite inferior atingido
      case 15: on=!!this.powered && !this.fault && this.vdc<(this._vdcNominal||538)*0.75; break; // subtensão
      case 18: on=this.runCmd && this.dirEff<0 && this.freqOut>0.01; break;         // operando em reverso
      case 35: on=this.runCmd && this.iout<0.05; break;                             // corrente zero
      case 38: on=!!this.fault; break;                                              // alarme
      default: on=false;
    }
    this.relayOn=on;
  }
  clearFault(){ this.fault=null; if(this.state==='FAULT') this.state='STOPPED'; }

  // Relação tensão/frequência (0..1) conforme a curva V/F selecionada em P2-00.
  vfRatio(motor){
    const fn = (motor && motor.fNom>0) ? motor.fNom : (this.pval('P4-05')||50);
    const r = Math.max(0, Math.min(this.freqOut/fn, 1));
    const mode = this.pval('P2-00');
    if(mode===1){ // curva multiponto P2-03..P2-08
      const pts=[[0,0],
        [this.pval('P2-03'),this.pval('P2-04')],
        [this.pval('P2-05'),this.pval('P2-06')],
        [this.pval('P2-07'),this.pval('P2-08')],
        [fn,100]]
        .filter(p=>isFinite(p[0])&&isFinite(p[1])&&p[0]>=0)
        .sort((a,b)=>a[0]-b[0]);
      for(let i=1;i<pts.length;i++){
        if(this.freqOut<=pts[i][0]){
          const [f0,v0]=pts[i-1], [f1,v1]=pts[i];
          const t=f1>f0?(this.freqOut-f0)/(f1-f0):1;
          return Math.max(0,Math.min(1,(v0+t*(v1-v0))/100));
        }
      }
      return 1;
    }
    const exp = mode===2 ? 2 : mode===3 ? 1.7 : mode===4 ? 1.5 : mode===5 ? 1.3 : 1;
    return Math.pow(r,exp);
  }

  // um passo de simulação, dt em segundos
  step(dt, motor, circuitInfo){
    this.tSinceEnergized += dt;
    circuitInfo = circuitInfo || {};
    this.powered = !!circuitInfo.powered;

    // sem alimentação de potência -> tudo cai a zero
    if(!circuitInfo.powered){
      this.vdc = 0; this.vout=0; this.iout=0; this.power=0; this.freqOut=0;
      this.state='STOPPED'; this.relayOn=false;
      return;
    }
    // barramento CC carrega rapidamente ao energizar (~0.3s)
    const vdcTarget = (circuitInfo.lineVoltage||380)*1.414;
    this._vdcNominal = vdcTarget;
    this.vdc += (vdcTarget-this.vdc)*Math.min(1, dt/0.25);

    // curto-circuito na saída (P9-16 habilita a proteção na energização)
    if(circuitInfo.outputShort && this.pval('P9-16')===1 && this.state!=='FAULT'){
      this.triggerFault(20,'Err20 — Curto-circuito à terra (saída U/V/W em curto)');
    }
    // falta de fase de entrada (P9-14)
    if(circuitInfo.inputPhaseLoss && this.pval('P9-14')===1 && this.state!=='FAULT'){
      this.triggerFault(23,'Err23 — Falta de fase na entrada (verifique L1/L2/L3)');
    }
    // falta de fase na saída (P9-15)
    if(circuitInfo.outputPhaseLoss && this.pval('P9-15')===1 && this.state!=='FAULT'){
      this.triggerFault(24,'Err24 — Falta de fase na saída (verifique U/V/W e o motor)');
    }

    if(this.state==='FAULT'){
      const fmaxFault=Math.max(1,this.pval('P0-14'));
      const decFault=Math.max(0.1,this.pval('P0-24'));
      this.freqOut = Math.max(0, this.freqOut - (fmaxFault/decFault)*dt);
      this.vout = 0; this.iout=0; this.power=0;
      if(motor){ motor.running=false; motor.rpmActual += (0-motor.rpmActual)*Math.min(1,dt/1.2); }
      this.updateRelay();
      this.evaluateRunCommand();
      return;
    }

    this.evaluateRunCommand();
    let dsign=this.direction; const dsel=this.pval('P0-13');                 // P0-13: sentido de rotação do motor
    if(dsel===1) dsign=-dsign;
    if(dsel===2 && dsign<0) this.runCmd=false;                               // reversão proibida
    this.dirEff=dsign;
    this.freqRef = this.runCmd ? this.computeFreqRef() : 0;
    if(!this.runCmd && this.pval('P1-13')===1) this.freqOut=0;               // P1-13 = 1: parada livre
    const f0=this.pval('P1-04');                                              // frequência de partida
    if(this.runCmd && f0>0 && this.freqOut<f0 && this.freqRef>=f0) this.freqOut=f0;

    // rampas de aceleração/desaceleração (P0-23 / P0-24).
    // O tempo programado é o tempo para atingir a frequência de referência
    // selecionada em P0-22 (máxima, pré-ajustada ou nominal do motor).
    const accT = Math.max(0.1, this.pval('P0-23'));
    const decT = Math.max(0.1, this.pval('P0-24'));
    const fmax = Math.max(1, this.pval('P0-14'));
    const rampSel = this.pval('P0-22');
    const rampRef = Math.max(0.1, rampSel===1 ? this.pval('P0-11') : rampSel===2 ? (motor&&motor.fNom||this.pval('P4-05')||fmax) : fmax);
    const accRate = rampRef/accT;
    const decRate = rampRef/decT;

    if(this.freqOut < this.freqRef){
      this.freqOut = Math.min(this.freqRef, this.freqOut + accRate*dt);
      this.state='ACCEL';
    } else if(this.freqOut > this.freqRef){
      this.freqOut = Math.max(this.freqRef, this.freqOut - decRate*dt);
      this.state= this.freqOut>0.01 ? 'DECEL':'STOPPED';
    } else {
      this.state = this.freqOut>0.01 ? 'RUN' : 'STOPPED';
    }
    if(this.freqOut<0.01){ this.freqOut=0; }

    // tensão de saída conforme a curva V/F selecionada (P2-00)
    const vfMode = this.pval('P2-00');
    const boost = this.pval('P2-01')||0; // % de torque boost -> eleva V em baixa f
    const vNomMotor = motor? motor.vNom : 380;
    const vRatio = this.vfRatio(motor);
    this.vout = vNomMotor*vRatio + (vNomMotor*(boost/100))*(1-vRatio);
    this.vout = Math.min(this.vout, vNomMotor*1.02);

    // corrente / motor
    if(motor && this.runCmd){
      motor.running = this.freqOut>0.05;
      this.iout = motor.estimateCurrent(this.freqOut, circuitInfo.motorLoadPct ?? this.loadPct, vfMode);
      const targetRpm = motor.targetRpm(this.freqOut, circuitInfo.motorLoadPct ?? this.loadPct)*(this.dirEff||this.direction);
      // inércia mecânica simples
      const tau = 0.6; // s
      motor.rpmActual += (targetRpm-motor.rpmActual)*Math.min(1, dt/tau);
      // térmica simples: sobrecarga sustentada aquece
      const overloadPct = this.iout/ (motor.iNom||1);
      const heatRate = (overloadPct-0.85)*6;
      motor.tempC += (heatRate>0?heatRate:heatRate*0.4)*dt;
      motor.tempC = Math.max(25, Math.min(180, motor.tempC));
      if(motor.tempC>150 && this.pval('P9-00')===1){
        this.triggerFault(14,'Err14 — Sobrecarga do motor (temperatura excessiva)');
      }
    } else {
      this.iout = Math.max(0, this.iout - this.iout*Math.min(1,dt/0.3));
      if(motor){
        motor.running=false;
        motor.rpmActual += (0-motor.rpmActual)*Math.min(1, dt/1.2);
        motor.tempC += (25-motor.tempC)*dt*0.02;
      }
    }
    this.power = (this.vout*this.iout*1.732*(motor?motor.fp:0.85))/1000; // kW trifásico aprox.

    // sobretensão barramento
    if(this.vdc > (this.pval('P9-04')||760) && this.state!=='FAULT'){
      this.triggerFault(10,'Err10 — Sobretensão no barramento CC');
    }
    this.updateRelay();
  }
}

window.MotorModel = MotorModel;
window.InverterEngine = InverterEngine;

</script>

<script>
// ============================================================
// NETWORK SOLVER — resolve condução elétrica do circuito
// Estratégia: grafo de adjacência nó<->nó (fios + condução interna
// de componentes), depois BFS a partir de cada fonte para marcar
// quais nós estão energizados (AC trifásico / DC 24V / GND).
// Resolve em passadas sucessivas pois contatores dependem da
// própria bobina energizada por outra malha do circuito.
// ============================================================
const NetworkSolver = (function(){
  // Potenciais separados por sistema: CA (L1/L2/L3/N) e CC (24V/0V).
  // O BFS parte de cada terminal de alimentação e só atravessa fios e
  // contatos FECHADOS; bobinas, lâmpadas e o motor são cargas (não conduzem).
  // O inversor AD600M passa a fornecer 24V/COM quando está energizado,
  // permitindo montar circuitos de selo e temporização alimentados por ele.
  let lastResult = {};
  let timerState = window.__TIMERS__ || (window.__TIMERS__ = {});
  const key=(i,t)=>i+'::'+t;
  const AC=['L1','L2','L3','N'];
  const DC=['24V','0V'];
  const LIVE=['L1','L2','L3','24V'];
  const P=(pot,k)=>pot[k]||new Set();
  const tkey=inst=>(inst.props && inst.props.tag || '').trim();

  function build(instances,wires,coils){
    const adj={}, edges=[]; let eid=0;
    const add=(a,b,meta)=>{ (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a);
      edges.push(Object.assign({ei:eid++,u:a,v:b}, meta||{})); };
    wires.forEach(w=>add(key(w.a.inst,w.a.term),key(w.b.inst,w.b.term),{kind:'wire',id:w.id}));
    instances.forEach(inst=>{
      const p=inst.props, id=inst.id, k=t=>key(id,t), def=getComponentDef(inst.type); if(!def) return;
      const on=!!coils[(p.tag||'').trim()];
      const tm=timerState[(p.tag||'').trim()];
      const tdone=!!(tm&&tm.done);
      const ce=(a,b)=>add(k(a),k(b),{kind:'inst',id:inst.id,type:inst.type});
      switch(inst.type){
        case 'botao-na': if(p.pressed) ce('13','14'); break;
        case 'botao-nf': if(!p.pressed) ce('11','12'); break;
        case 'chave-selectora': if(p.on) ce('13','14'); break;
        case 'inversor-ad600m': if(window.__INV_RELAY__) ce('TA','TC'); else ce('TA','TB'); break;   // relé: TA comum, TB NF, TC NA
        case 'contato-na': if(on) ce('13','14'); break;
        case 'contato-nf': if(!on) ce('21','22'); break;
        case 'contato-temporizado-na': if(tdone) ce('1','2'); break;
        case 'contato-temporizado-nf': if(!tdone) ce('3','4'); break;
        case 'contato-temporizado-na-nf': if(tdone) ce('15','18'); else ce('15','16'); break;
        case 'contato-potencia': if(on) for(let i=0;i<3;i++) ce(''+(2*i+1),''+(2*i+2)); break;
        default: if(def.poles && p.ligado) for(let i=0;i<def.poles;i++) ce(''+(2*i+1),''+(2*i+2));
      }
    });
    return {adj,edges};
  }

  function sourceBFS(pot,adj,start,potName){
    const seen=new Set([start]), q=[start];
    while(q.length){ const c=q.shift(); (pot[c]=pot[c]||new Set()).add(potName);
      (adj[c]||[]).forEach(n=>{ if(!seen.has(n)){seen.add(n);q.push(n);} }); }
  }
  function phaseSet(pot,inv){
    const ph=new Set();
    if(!inv) return ph;
    ['L1','L2','L3'].forEach(t=>P(pot,key(inv.id,t)).forEach(l=>{ if(['L1','L2','L3'].includes(l)) ph.add(l); }));
    return ph;
  }
  function potentials(instances,adj){
    const pot={};
    instances.forEach(inst=>{
      const def=getComponentDef(inst.type); if(!def) return;
      if(def.srcPot) sourceBFS(pot,adj,key(inst.id,'T'),def.srcPot);
      else if(inst.type==='fonte-trifasica'){
        ['L1','L2','L3'].forEach(t=>sourceBFS(pot,adj,key(inst.id,t),t));
      } else if(inst.type==='fonte-24vcc'){
        sourceBFS(pot,adj,key(inst.id,'+'),'24V');
        sourceBFS(pot,adj,key(inst.id,'-'),'0V');
      }
    });
    // Fonte interna 24V/COM do inversor: só existe com o inversor energizado.
    const inv=instances.find(i=>i.type==='inversor-ad600m');
    if(inv && phaseSet(pot,inv).size>=2){
      sourceBFS(pot,adj,key(inv.id,'24V'),'24V');
      sourceBFS(pot,adj,key(inv.id,'COM'),'0V');
    }
    return pot;
  }
  function pair(pot,k1,k2){
    const s1=P(pot,k1), s2=P(pot,k2);
    for(const a of s1) for(const b of s2){
      if(a===b || a==='PE' || b==='PE') continue;
      const aAC=AC.includes(a), bAC=AC.includes(b), aDC=DC.includes(a), bDC=DC.includes(b);
      if(aAC && bAC){ if(a==='N' && b==='N') continue; return true; }          // fase-fase ou fase-neutro
      if(aDC && bDC){ if((a==='24V'&&b==='0V')||(a==='0V'&&b==='24V')) return true; } // +24V e 0V
    }
    return false;
  }
  function kindOf(set){ let l=false,d=false,n=false,z=false,e=false; set.forEach(x=>{ if(x==='L1'||x==='L2'||x==='L3') l=true; else if(x==='24V') d=true; else if(x==='N') n=true; else if(x==='0V') z=true; else if(x==='PE') e=true; });
    return l?'ac':d?'dc':n?'neu':z?'neg':e?'pe':null; }
  function cls(set){ let l=false,r=false,e=false; set.forEach(x=>{ if(LIVE.includes(x)) l=true; else if(x==='PE') e=true; else r=true; }); return l?'live':(r?'ref':(e?'pe':null)); }
  function bfsConnected(a,b,adj){
    if(a===b) return true; const q=[a], seen=new Set([a]);
    while(q.length){ const c=q.shift(); for(const n of (adj[c]||[])){ if(n===b) return true; if(!seen.has(n)){seen.add(n);q.push(n);} } }
    return false;
  }

  function timerUpdate(instances,pot,dt){
    const active=window.__SIM_RUNNING__ && dt>0;
    instances.forEach(i=>{
      if(i.type!=='temporizador-bobina') return;
      const tag=tkey(i); if(!tag) return;
      const st=timerState[tag]||(timerState[tag]={elapsed:0,done:false});
      const en=pair(pot,key(i.id,'A1'),key(i.id,'A2'));
      const delay=Math.max(0, Number(i.props.delay)||0);
      const mode=i.props.mode==='off'?'off':'on';
      if(mode==='on'){
        if(en){ if(active) st.elapsed+=dt; if(st.elapsed>=delay){ st.elapsed=delay; st.done=true; } }
        else { st.elapsed=0; st.done=false; }
      } else {
        if(en){ st.elapsed=0; st.done=true; }
        else if(st.done){ if(active) st.elapsed+=dt; if(st.elapsed>=delay){ st.elapsed=delay; st.done=false; } }
      }
      i.props.energized=en;
      i.props.done=st.done;
      i.props.progress=delay>0?Math.min(100,Math.round(st.elapsed/delay*100)):(st.done?100:0);
    });
  }

  // ============================================================
  // FLUXO DE CORRENTE REAL
  // Um trecho só brilha quando faz parte de um caminho fechado entre
  // dois potenciais diferentes, passando por uma carga. O grafo de
  // condução é decomposto em blocos biconectados (Tarjan); para cada
  // carga energizada, marcamos apenas as arestas que pertencem a algum
  // caminho simples entre o terminal da carga e a fonte correspondente.
  // Ramos mortos (fios que terminam em aberto) não são marcados.
  // ============================================================
  function computeCurrentFlow(instances,wires,graph,pot,coils,shortCircuit,inv,powered,motorConnected,out){
    const edges=graph.edges||[];
    const incident={};
    edges.forEach((e,ei)=>{ (incident[e.u]=incident[e.u]||[]).push(ei); (incident[e.v]=incident[e.v]||[]).push(ei); });
    const nodes=Object.keys(incident);

    // --- componentes biconectados (arestas) ---
    const disc={}, low={}, parentEdge={}, stack=[]; let clock=0;
    const blocks=[];
    function dfs(u){
      disc[u]=low[u]=++clock;
      (incident[u]||[]).forEach(ei=>{
        if(parentEdge[u]===ei) return;
        const e=edges[ei], v=(e.u===u?e.v:e.u);
        if(!disc[v]){
          stack.push(ei); parentEdge[v]=ei; dfs(v);
          low[u]=Math.min(low[u],low[v]);
          if(low[v]>=disc[u]){
            const comp=[]; let x;
            do{ x=stack.pop(); comp.push(x); }while(x!==ei);
            blocks.push(comp);
          }
        } else if(disc[v]<disc[u]){
          stack.push(ei); low[u]=Math.min(low[u],disc[v]);
        }
      });
    }
    nodes.forEach(n=>{ if(!disc[n]){ dfs(n); if(stack.length) blocks.push(stack.splice(0)); } });

    // --- grafo bloco-vértice ---
    const bAdj={};
    const link=(a,b)=>{ (bAdj[a]=bAdj[a]||[]).push(b); (bAdj[b]=bAdj[b]||[]).push(a); };
    blocks.forEach((comp,bi)=>{
      const bn='b:'+bi, verts=new Set();
      comp.forEach(ei=>{ verts.add(edges[ei].u); verts.add(edges[ei].v); });
      verts.forEach(v=>link(bn,'v:'+v));
    });
    function blockPath(s,t){
      if(s===t) return [];
      const sk='v:'+s, tk='v:'+t;
      if(!bAdj[sk]||!bAdj[tk]) return [];
      const prev={}; prev[sk]=null; const q=[sk];
      while(q.length){ const c=q.shift(); if(c===tk) break; (bAdj[c]||[]).forEach(n=>{ if(!(n in prev)){ prev[n]=c; q.push(n); } }); }
      if(!(tk in prev)) return [];
      const out=[]; let c=tk;
      while(c){ if(c.startsWith('b:')) out.push(Number(c.slice(2))); c=prev[c]; }
      return out;
    }

    // --- fontes por potencial (para achar o caminho de volta) ---
    const rootsByPot={};
    instances.forEach(i=>{ const def=getComponentDef(i.type); if(def&&def.srcPot) (rootsByPot[def.srcPot]=rootsByPot[def.srcPot]||[]).push(key(i.id,'T')); });
    if(inv && powered){
      (rootsByPot['24V']=rootsByPot['24V']||[]).push(key(inv.id,'24V'));
      (rootsByPot['0V']=rootsByPot['0V']||[]).push(key(inv.id,'COM'));
    }

    const marked=new Set(), currentInst=new Set(), loadNodes=new Set();
    function markToRoots(node,potSet){
      (potSet||new Set()).forEach(p=>{
        (rootsByPot[p]||[]).forEach(r=>{ blockPath(node,r).forEach(bi=>blocks[bi].forEach(ei=>marked.add(ei))); });
      });
    }
    function addLoad(a,b,id){
      if(!pair(pot,a,b)) return false;
      loadNodes.add(a); loadNodes.add(b);
      markToRoots(a,P(pot,a)); markToRoots(b,P(pot,b));
      if(id) currentInst.add(id);
      return true;
    }

    instances.forEach(inst=>{
      const def=getComponentDef(inst.type); if(!def) return;
      switch(inst.type){
        case 'bobina-contator': case 'temporizador-bobina':
          addLoad(key(inst.id,'A1'),key(inst.id,'A2'),inst.id); break;
        case 'lampada-piloto': case 'buzzer':
          addLoad(key(inst.id,def.terms[0].id),key(inst.id,def.terms[1].id),inst.id); break;
        case 'inversor-ad600m':
          if(powered && inv){
            ['L1','L2','L3'].forEach(t=>{ const n=key(inst.id,t); markToRoots(n,P(pot,n)); });
          }
          break;
        case 'potenciometro':
          if(powered && inv){
            const s1=blockPath(key(inst.id,'+10V'),key(inv.id,'+10V'));
            const s2=blockPath(key(inst.id,'GND'),key(inv.id,'GND'));
            if(s1.length||s2.length){ s1.forEach(bi=>blocks[bi].forEach(ei=>marked.add(ei))); s2.forEach(bi=>blocks[bi].forEach(ei=>marked.add(ei))); currentInst.add(inst.id); }
          }
          break;
        case 'motor-trifasico':
          if(inv && out>0.01 && motorConnected){
            [['U','U1'],['V','V1'],['W','W1']].forEach(([a,b])=>{ blockPath(key(inv.id,a),key(inst.id,b)).forEach(bi=>blocks[bi].forEach(ei=>marked.add(ei))); });
            currentInst.add(inst.id);
          }
          break;
      }
    });

    // componentes condutores (contatos, disjuntores, botoeiras etc.) em série com a corrente
    marked.forEach(ei=>{ const e=edges[ei]; if(e.kind==='inst') currentInst.add(e.id); });
    const currentNodes=new Set(loadNodes);
    marked.forEach(ei=>{ const e=edges[ei]; currentNodes.add(e.u); currentNodes.add(e.v); });
    // fontes e emendas atravessadas por corrente
    instances.forEach(i=>{
      if(i.type.startsWith('src-') && currentNodes.has(key(i.id,'T'))) currentInst.add(i.id);
      if(i.type==='juncao' && currentNodes.has(key(i.id,'J'))) currentInst.add(i.id);
    });
    const currentWires=new Set();
    marked.forEach(ei=>{ const e=edges[ei]; if(e.kind==='wire') currentWires.add(e.id); });
    return {currentInst,currentWires,currentNodes};
  }

  function solve(instances,wires,dt){
    dt = Math.max(0, Math.min(0.25, Number(dt)||0));
    let coils = window.__SIM_RUNNING__ ? Object.assign({}, window.__COILS__||{}) : {}, adj, pot, graph;

    // 1) resolve bobinas/contatos com os estados de temporizador da iteração anterior
    for(let pass=0;pass<10;pass++){
      graph=build(instances,wires,coils); adj=graph.adj; pot=potentials(instances,adj);
      const nc={};
      instances.forEach(i=>{ if(i.type==='bobina-contator' && pair(pot,key(i.id,'A1'),key(i.id,'A2'))) nc[(i.props.tag||'').trim()]=true; });
      const same=Object.keys(nc).length===Object.keys(coils).length && Object.keys(nc).every(k=>coils[k]);
      coils=nc; if(same) break;
    }
    // 2) integra os temporizadores uma única vez por passo
    timerUpdate(instances,pot,dt);
    // 3) re-resolve contatos temporizados já com o novo estado
    for(let pass=0;pass<10;pass++){
      graph=build(instances,wires,coils); adj=graph.adj; pot=potentials(instances,adj);
      const nc={};
      instances.forEach(i=>{ if(i.type==='bobina-contator' && pair(pot,key(i.id,'A1'),key(i.id,'A2'))) nc[(i.props.tag||'').trim()]=true; });
      const same=Object.keys(nc).length===Object.keys(coils).length && Object.keys(nc).every(k=>coils[k]);
      coils=nc; if(same) break;
    }
    timerUpdate(instances,pot,0); // atualiza apenas indicadores (não avança o tempo)
    instances.forEach(i=>{ if(i.type==='bobina-contator') i.props.energized=!!coils[(i.props.tag||'').trim()]; });

    const inv=instances.find(i=>i.type==='inversor-ad600m');
    let powered=false,inputPhaseLoss=false,outputShort=false,outputPhaseLoss=false,motorConnected=false,ai1Volts=0; const di={};
    if(inv){
      const ph=phaseSet(pot,inv);
      powered=ph.size>=2; inputPhaseLoss=powered && ph.size===2;
      const ku=key(inv.id,'U'),kv=key(inv.id,'V'),kw=key(inv.id,'W');
      outputShort=bfsConnected(ku,kv,adj)||bfsConnected(ku,kw,adj)||bfsConnected(kv,kw,adj);
      const com=key(inv.id,'COM');
      // Entradas DI do AD600M são NPN: ativam quando o terminal é levado ao COM.
      ['DI1','DI2','DI3','DI4'].forEach(d=>{ const dk=key(inv.id,d); di[d]=powered && bfsConnected(dk,com,adj); });
      const potInst=instances.find(i=>i.type==='potenciometro');
      if(potInst && powered &&
         bfsConnected(key(inv.id,'AI1'),key(potInst.id,'AI1'),adj) &&
         bfsConnected(key(inv.id,'+10V'),key(potInst.id,'+10V'),adj) &&
         bfsConnected(key(inv.id,'GND'),key(potInst.id,'GND'),adj)){
        ai1Volts=potInst.props.value||0;
      }
      else if(powered && bfsConnected(key(inv.id,'AI1'),key(inv.id,'+10V'),adj)) ai1Volts=10;
      const motor=instances.find(i=>i.type==='motor-trifasico');
      const out0=window.__INV_OUT__||0;
      if(motor){
        const map=[['U','U1'],['V','V1'],['W','W1']];
        const phaseStates=map.map(([a,b])=>bfsConnected(key(inv.id,a),key(motor.id,b),adj));
        motorConnected=phaseStates.every(Boolean);
        // Só caracteriza falta de fase se ao menos uma fase chega ao motor.
        if(out0>0.01 && !motorConnected && phaseStates.some(Boolean)) outputPhaseLoss=true;
      }
    }
    const out=window.__INV_OUT__||0;

    const ns={}; let shortCircuit=false;
    wires.forEach(w=>{
      const s=P(pot,key(w.a.inst,w.a.term)); const nonPE=[...s].filter(x=>x!=='PE');
      const hasLive=[...s].some(x=>LIVE.includes(x)), hasPE=s.has('PE');
      if(nonPE.length>=2 || (hasLive&&hasPE)){ ns['wire:'+w.id]='short'; ns['wglow:'+w.id]='short'; shortCircuit=true; }
      else { ns['wire:'+w.id]=cls(s)||'none'; ns['wglow:'+w.id]=null; }
    });

    const flow=computeCurrentFlow(instances,wires,graph,pot,coils,shortCircuit,inv,powered,motorConnected,out);
    wires.forEach(w=>{ if(ns['wire:'+w.id]!=='short' && flow.currentWires.has(w.id)) ns['wglow:'+w.id]='current'; });

    instances.forEach(inst=>{
      const def=getComponentDef(inst.type); if(!def) return;
      let en=false, glow=false; const termSig=[];
      def.terms.forEach(t=>{ const n=key(inst.id,t.id), tc=flow.currentNodes.has(n);
        ns['current:'+inst.id+':'+t.id]=tc; termSig.push(tc?'1':'0'); });
      if(inst.type==='bobina-contator'||inst.type==='temporizador-bobina') en=!!inst.props.energized;
      else if(inst.type==='lampada-piloto'||inst.type==='buzzer'){ glow=pair(pot,key(inst.id,def.terms[0].id),key(inst.id,def.terms[1].id)); en=glow; ns['glow:'+inst.id]=glow; }
      else if(inst.type==='inversor-ad600m') en=powered;
      else if(inst.type==='motor-trifasico') en=!!inv && out>0.01 && motorConnected;
      else if(inst.type==='contato-temporizado-na'||inst.type==='contato-temporizado-nf'||inst.type==='contato-temporizado-na-nf'){ const st=timerState[tkey(inst)]; en=!!(st&&st.done); }
      const cur=flow.currentInst.has(inst.id);
      // Contatos auxiliares (ex.: K1) precisam redesenhar quando a bobina de mesma TAG muda,
      // mesmo que a corrente no ramo de contato não se altere.
      const coilOn=!!coils[String((inst.props&&inst.props.tag)||'').trim()];
      ns['energized:'+inst.id]=en;
      ns['current:'+inst.id]=cur;
      ns['sig:'+inst.id]=en+'|'+glow+'|'+cur+'|'+termSig.join('')+'|'+coilOn;
    });
    wires.forEach(w=>{ ns['wsig:'+w.id]=ns['wire:'+w.id]+'|'+(ns['wglow:'+w.id]||''); });
    window.__NET_STATE__=ns; window.__COILS__=coils; window.__TIMERS__=timerState;
    lastResult={powered,inputPhaseLoss,outputPhaseLoss,motorConnected,outputShort,shortCircuit,di,ai1Volts,inverterInst:inv,energizedCoils:coils,timers:timerState};
    if(window.onNetworkSolved) window.onNetworkSolved(lastResult);
    return lastResult;
  }
  function reset(){
    timerState = window.__TIMERS__ = {};
    window.__COILS__ = {};
  }
  return { solve, reset, get last(){return lastResult;} };
})();
window.NetworkSolver = NetworkSolver;

</script>

<script>
// ============================================================
// EDITOR DE BANCADA — canvas SVG, drag&drop, fiação
// ============================================================
const CircuitEditor = (function(){
  // Realce da simulação: somente vermelho e somente onde há corrente real.
  const CURRENT_COLOR='#d81b1b';
  const CURRENT_GLOW='#ff2020';
  const collapsedCats=new Set();
  let svg, gWires, gComps, gTemp;
  let instances = [];   // {id, type, x, y, rot, props}
  let wires = [];       // {id, a:{inst,term}, b:{inst,term}, color}
  let nextId = 1;
  let selected = [];    // [{kind:'inst'|'wire', id}] — seleção múltipla com Ctrl
  const isSelected = (kind,id)=>selected.some(s=>s.kind===kind&&s.id===id);
  const selInsts = ()=>selected.filter(s=>s.kind==='inst');
  const selWires = ()=>selected.filter(s=>s.kind==='wire');
  let dragging = null;
  let wireDrag = null;   // arrasto de segmento de fio {w, ha, moved}
  let wireWaypointDrag = null; // arrasto de um vértice de fio {w, idx, moved}
  let wireSegDrag = null;      // arrasto de segmento de fio com waypoints {w, seg, axis, start, orig}
  let wiring = null;    // {from:{inst,term,x,y}, mouse:{x,y}}
  let hoverTarget = null; // último terminal sob o cursor durante wiring (fallback de robustez)
  let showLabels = true;
  let showGrid = true;
  let paletteCollapsed = false;
  let scale = 1;
  let panX=0, panY=0;
  let isPanning=false, panStart=null;
  let userChangeCb = ()=>{};
  let histCur = null, undoStack = [], redoStack = [], histLock = false;
  const snap = ()=>JSON.stringify({instances,wires,nextId});
  function recordHistory(){
    if(histLock||simRunning) return;
    const s=snap();
    if(histCur===null){ histCur=s; return; }
    if(s===histCur) return;
    undoStack.push(histCur); if(undoStack.length>100) undoStack.shift();
    histCur=s; redoStack=[];
  }
  let onChangeCb = ()=>{ recordHistory(); userChangeCb(); };
  let onSelectCb = ()=>{};
  let onMotorParamChange = null;
  let simRunning = false;

  // ---- paleta de cores de fio ----
  const WIRE_QUICK = [
    {c:'#1f9d55', n:'Verde'}, {c:'#e5b800', n:'Amarelo'}, {c:'#d63c3c', n:'Vermelho'},
    {c:'#111111', n:'Preto'}, {c:'#2f6fed', n:'Azul'}
  ];
  const WIRE_RECENT_KEY = 'inverterlab-wire-recent';
  const WIRE_LAST_KEY = 'inverterlab-wire-last';
  let recentWireColors = [];
  let lastWireColor = '#111111';
  try{
    const r=JSON.parse(localStorage.getItem(WIRE_RECENT_KEY)||'[]');
    if(Array.isArray(r)) recentWireColors=r.filter(x=>/^#[0-9a-f]{6}$/i.test(x)).slice(0,5);
    const l=localStorage.getItem(WIRE_LAST_KEY);
    if(/^#[0-9a-f]{6}$/i.test(l||'')) lastWireColor=l;
  }catch(e){}
  function rememberWireColor(c){
    if(!/^#[0-9a-f]{6}$/i.test(c||'')) return;
    lastWireColor=c;
    recentWireColors=[c,...recentWireColors.filter(x=>x.toLowerCase()!==c.toLowerCase())].slice(0,5);
    try{ localStorage.setItem(WIRE_RECENT_KEY, JSON.stringify(recentWireColors)); localStorage.setItem(WIRE_LAST_KEY,c); }catch(e){}
  }
  function wirePaletteHtml(current){

  function wireCanvasEvents(){
    const wrap = document.getElementById('ce-canvas-wrap');
    wrap.addEventListener('dragover', e=>e.preventDefault());
    wrap.addEventListener('drop', e=>{
      e.preventDefault();
      if(simRunning){ toast('Pare a simulação para adicionar componentes','warn'); return; }
      const type = e.dataTransfer.getData('text/plain');
      if(!type) return;
      const r = wrap.getBoundingClientRect();
      addInstance(type, toWorld(e.clientX-r.left, e.clientY-r.top));
    });
    svg.addEventListener('mousedown', e=>{
      if(e.target===svg || e.target.id==='ce-bgrect'){
        e.preventDefault();
        isPanning=true; panStart={x:e.clientX-panX,y:e.clientY-panY};
        deselect();
      }
    });
    window.addEventListener('mousemove', e=>{
      const wrap = document.getElementById('ce-canvas-wrap');
      const r = wrap.getBoundingClientRect();
      const mx=e.clientX-r.left, my=e.clientY-r.top;
      if(isPanning){ panX=e.clientX-panStart.x; panY=e.clientY-panStart.y; applyTransform(); }
      if(dragging){
        const w = toWorld(mx,my);
        let moved=false;
        dragging.items.forEach(it=>{
          const nx=w.x-it.offX, ny=w.y-it.offY;
          if(nx!==it.inst.x||ny!==it.inst.y){ it.inst.x=nx; it.inst.y=ny; moved=true; renderComp(it.inst); }
        });
        if(moved){
          dragging.moved=true;
          const ids=new Set(dragging.items.map(it=>it.inst.id));
          relayout();
          wires.forEach(w0=>{ if(ids.has(w0.a.inst)||ids.has(w0.b.inst)) renderWire(w0); });
        }
      }
      if(wireDrag){
        const d=wireDrag, rx=(mx-panX)/scale, ry=(my-panY)/scale;
        if(!d.axis){ const dx=rx-d.sx, dy=ry-d.sy; if(Math.max(Math.abs(dx),Math.abs(dy))>5) d.axis=Math.abs(dx)>=Math.abs(dy)?'x':'y'; }
        if(d.axis){ const p=toWorld(mx,my);
          if(d.axis==='x'){ if(d.w.bx!==p.x||d.w.by!=null||d.w.bend!=null){ d.w.bx=p.x; delete d.w.by; delete d.w.bend; d.moved=true; relayout(); } }
          else { if(d.w.by!==p.y||d.w.bx!=null||d.w.bend!=null){ d.w.by=p.y; delete d.w.bx; delete d.w.bend; d.moved=true; relayout(); } } }
      }
      if(wireWaypointDrag){
        const d=wireWaypointDrag, p=toWorld(mx,my);
        if(d.w.pts && d.w.pts[d.idx] && (d.w.pts[d.idx].x!==p.x || d.w.pts[d.idx].y!==p.y)){
          d.w.pts[d.idx]={x:p.x,y:p.y}; d.moved=true; relayout(); renderWire(d.w);
        }
      }
      if(wireSegDrag){
        const d=wireSegDrag, p=toWorld(mx,my);
        if(d.w.pts && d.orig){
          const delta = d.axis==='h' ? p.y-d.start.y : p.x-d.start.x;
          d.w.pts = d.orig.map((q,i)=>d.idxs.includes(i) ? (d.axis==='h'?{x:q.x,y:q.y+delta}:{x:q.x+delta,y:q.y}) : {x:q.x,y:q.y});
          d.moved=true; relayout(); renderWire(d.w);
        }
      }
      if(wiring){
        wiring.mouse = toWorld(mx,my);
        // usa posição real do mouse, não snap, para ficar fluido
        wiring.mouseReal = {x:(mx-panX)/scale, y:(my-panY)/scale};
        renderTempWire();
      }
    });
    window.addEventListener('mouseup', ()=>{
      isPanning=false;
      if(wireDrag){ const d=wireDrag; wireDrag=null; if(d.moved){ materializeWaypoints(d.w); onChangeCb(); } }
      if(wireWaypointDrag){ const d=wireWaypointDrag; wireWaypointDrag=null; if(d.moved) onChangeCb(); }
      if(wireSegDrag){ const d=wireSegDrag; wireSegDrag=null; if(d.moved) onChangeCb(); }
      if(dragging){ const d=dragging; dragging=null; if(d.primary.type==='inversor-ad600m' && !d.moved) openInverterPanel(d.primary); onChangeCb(); checkNet(); }
      if(wiring && hoverTarget){ finishWiring(hoverTarget.inst, hoverTarget.term); }
      else if(wiring){ cancelWiring(); }
      // libera botoeiras momentâneas mesmo que o mousedown tenha redesenhado o SVG
      let released=false;
      instances.forEach(i=>{
        if((i.type==='botao-na'||i.type==='botao-nf') && i.props.pressed){ i.props.pressed=false; renderComp(i); released=true; }
      });
      if(released) onChangeCb();
    });
    svg.addEventListener('wheel', e=>{
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      const mx=e.clientX-r.left, my=e.clientY-r.top;
      const old = scale;
      scale = Math.min(2.2, Math.max(0.35, scale * (e.deltaY<0?1.08:0.92)));
      panX = mx - (mx-panX)*(scale/old);
      panY = my - (my-panY)*(scale/old);
      applyTransform();
    }, {passive:false});
    window.addEventListener('keydown', e=>{
      if(document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if(!document.getElementById('view-bancada').classList.contains('active')) return;
      if(e.key==='Delete'||e.key==='Backspace'){ deleteSelected(); }
      if(e.key==='Escape'){ cancelWiring(); deselect(); }
      if(e.ctrlKey||e.metaKey){ const k=e.key.toLowerCase();
        if(k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
        else if(k==='y'||(k==='z'&&e.shiftKey)){ e.preventDefault(); redo(); }
        else if(k==='d'){ e.preventDefault(); duplicateSelected(); } }
    });
  }

  function applyTransform(){
    document.getElementById('ce-viewport').setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
  }
  function fitToContent(){
    if(!instances.length || !svg) return;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    instances.forEach(inst=>{
      const def=getComponentDef(inst.type); if(!def) return;
      const w=def.w*GRID, h=def.h*GRID;
      const cx=inst.x+w/2, cy=inst.y+h/2, rad=(inst.rot||0)*Math.PI/180;
      const cos=Math.cos(rad), sin=Math.sin(rad);
      [[inst.x,inst.y],[inst.x+w,inst.y],[inst.x,inst.y+h],[inst.x+w,inst.y+h]].forEach(([px,py])=>{
        const dx=px-cx, dy=py-cy;
        const rx=cx+dx*cos-dy*sin, ry=cy+dx*sin+dy*cos;
        minX=Math.min(minX,rx); minY=Math.min(minY,ry); maxX=Math.max(maxX,rx); maxY=Math.max(maxY,ry);
      });
    });
    if(!isFinite(minX)) return;
    const rect=svg.getBoundingClientRect();
    const pad=42, bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
    const fit=Math.min((rect.width-pad*2)/bw, (rect.height-pad*2)/bh);
    scale=Math.min(1.15, Math.max(0.35, fit));
    panX=(rect.width-bw*scale)/2 - minX*scale;
    panY=(rect.height-bh*scale)/2 - minY*scale;
    applyTransform();
  }

  function addInstance(type, pos){
    const def = getComponentDef(type);
    if(!def) return;
    const inst = { id: uid('c'), type, x: pos.x, y: pos.y, rot:0, props: JSON.parse(JSON.stringify(def.props||{})) };
    if(def.tagPrefix){ const n=instances.filter(i=>{const d=getComponentDef(i.type);return d&&d.tagPrefix===def.tagPrefix&&!d.tagRef;}).length+1;
      inst.props.tag = def.tagRef ? def.tagPrefix+'1' : def.tagPrefix+n; }
    instances.push(inst);
    renderComp(inst);
    select('inst', inst.id);
    onChangeCb();
    toast(`${def.label} adicionado`, 'ok');
    return inst;
  }

  function findInst(id){ return instances.find(i=>i.id===id); }

  function termWorldPos(inst, term){
    const def = getComponentDef(inst.type);
    let x = inst.x + term.x*GRID, y = inst.y + term.y*GRID;
    return rotatePoint(inst, x, y);
  }
  function rotatePoint(inst, x, y){
    if(!inst.rot) return {x,y};
    const def = getComponentDef(inst.type);
    const cx = inst.x + (def.w*GRID)/2, cy = inst.y + (def.h*GRID)/2;
    const rad = inst.rot*Math.PI/180;
    const dx=x-cx, dy=y-cy;
    return { x: cx+dx*Math.cos(rad)-dy*Math.sin(rad), y: cy+dx*Math.sin(rad)+dy*Math.cos(rad) };
  }

  function renderComp(inst){
    const def = getComponentDef(inst.type);
    let g = document.getElementById('g-'+inst.id);
    if(!g){
      g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.id = 'g-'+inst.id;
      g.setAttribute('class','comp-g');
      gComps.appendChild(g);
    }
    const w = def.w*GRID, h = def.h*GRID;
    const isSel = isSelected('inst', inst.id);
    const cur = simRunning && window.__NET_STATE__ ? window.__NET_STATE__['current:'+inst.id] : false;
    // Sinaleiros usam apenas a cor escolhida pelo usuário; não recebem realce vermelho de corrente.
    const gstyle = (cur && inst.type!=='inversor-ad600m' && inst.type!=='lampada-piloto') ? ` style="filter:drop-shadow(0 0 4px ${CURRENT_GLOW}aa);"` : '';
    let html = `<g transform="translate(${inst.x},${inst.y}) rotate(${inst.rot||0} ${w/2} ${h/2})"${gstyle}>`;
    if(!def.junction) html += renderBody(def, inst, w, h, isSel);
    if(def.junction && isSel) html += `<circle cx="0" cy="0" r="9" fill="none" stroke="var(--accent)" stroke-width="1.6" style="pointer-events:none;"/>`;
    // área de clique POR CIMA do corpo (antes ficava atrás dele e o inversor nunca recebia o clique)
    if(!def.junction) html += `<rect class="comp-hitarea" x="-4" y="-4" width="${w+8}" height="${h+8}" fill="transparent" style="cursor:pointer;"/>`;
    // terminais
    def.terms.forEach(t=>{
      const tx=t.x*GRID, ty=t.y*GRID;
      const st = terminalState(inst,t);
      html += `<circle class="term-hit" data-inst="${inst.id}" data-term="${t.id}" cx="${tx}" cy="${ty}" r="${def.junction?8:11}"
        fill="transparent" style="cursor:crosshair;"/>`;
      html += `<circle class="term-dot" data-inst="${inst.id}" data-term="${t.id}" cx="${tx}" cy="${ty}" r="${def.junction?4.5:5}"
        fill="${st.color}" stroke="#0b0d10" stroke-width="1.5" style="pointer-events:none;"/>`;
      if(showLabels && !def.junction){
        const anchor = t.dir==='right'?'start':(t.dir==='left'?'end':'middle');
        const lx = t.dir==='right'? tx+8 : (t.dir==='left'? tx-8: tx);
        const ly = t.dir==='up'? ty-8 : (t.dir==='down'? ty+14 : ty+3);
        html += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-family="JetBrains Mono" font-size="9"
          fill="#667" style="pointer-events:none;">${t.id}</text>`;
      }
    });
    if(def.junction) html += `<circle class="junction-move" cx="0" cy="0" r="5.5" fill="var(--accent)" fill-opacity=".35" stroke="var(--accent)" stroke-width="1.2" style="cursor:move;"/>`;
    html += `</g>`;
    g.innerHTML = html;
    g.querySelectorAll('.term-hit').forEach(el=>{
      el.addEventListener('mousedown', ev=>{
        if(simRunning) return; // fiação só é editável com simulação parada
        ev.stopPropagation(); ev.preventDefault();
        const term = def.terms.find(t=>t.id===el.dataset.term);
        if(def.junction && ev.shiftKey){ // Shift + arrastar: move a emenda
          startDrag(inst, ev); return;
        }
        startWiring(inst, term);
      });
      el.addEventListener('mouseenter', ()=>{ if(wiring) hoverTarget = {inst, term: def.terms.find(t=>t.id===el.dataset.term)}; });
      el.addEventListener('mouseleave', ()=>{ if(hoverTarget && hoverTarget.inst.id===inst.id) hoverTarget=null; });
      el.addEventListener('mouseup', ev=>{
        if(simRunning) return;
        ev.stopPropagation();
        const term = def.terms.find(t=>t.id===el.dataset.term);
        finishWiring(inst, term);
      });
    });
    const jm = g.querySelector('.junction-move');
    if(jm){
      jm.addEventListener('mousedown', ev=>{
        if(simRunning) return;
        ev.stopPropagation(); ev.preventDefault();
        startDrag(inst, ev);
      });
    }
    const hitEl = g.querySelector('.comp-hitarea');
    const isMomentary = inst.type==='botao-na' || inst.type==='botao-nf';
    const isActuatable = ['botao-na','botao-nf','chave-selectora','disjuntor','disjuntor-bipolar','disjuntor-monopolar','disjuntor-motor'].includes(inst.type);
    if(hitEl){
      hitEl.addEventListener('mousedown', ev=>{
        ev.stopPropagation(); ev.preventDefault();
        const additive=!!(ev.ctrlKey||ev.metaKey);
        if(simRunning){
          // simulação rodando: botoeiras e inversor respondem no mousedown;
          // os demais acionáveis são selecionados/acionados no click.
          if(inst.type==='inversor-ad600m'){ select('inst',inst.id,additive); openInverterPanel(inst); return; }
          if(isMomentary){ select('inst',inst.id,additive); inst.props.pressed=true; renderComp(inst); onChangeCb(); return; }
          return;
        }
        // simulação parada: Ctrl alterna a seleção; arrastar move todos os selecionados
        startDrag(inst, ev);
      });
      hitEl.addEventListener('click', ev=>{
        ev.stopPropagation();
        if(isMomentary) return; // tratado por mousedown/up próprios
        if(!simRunning) return; // outros componentes acionáveis só respondem com sim rodando
        const additive=!!(ev.ctrlKey||ev.metaKey);
        if(isActuatable){ handleComponentClick(inst); select('inst',inst.id,additive); return; }
        select('inst',inst.id,additive);
      });
      hitEl.addEventListener('mouseup', ()=>{
        if(!simRunning) return;
        if(inst.type==='botao-na'){ inst.props.pressed=false; renderComp(inst); onChangeCb(); }
        if(inst.type==='botao-nf'){ inst.props.pressed=false; renderComp(inst); onChangeCb(); }
      });
      hitEl.addEventListener('mouseleave', ()=>{
        if(!simRunning) return;
        if(inst.type==='botao-na'&&inst.props.pressed){ inst.props.pressed=false; renderComp(inst); onChangeCb(); }
        if(inst.type==='botao-nf'&&inst.props.pressed){ inst.props.pressed=false; renderComp(inst); onChangeCb(); }
      });
    }
  }

  function handleComponentClick(inst){
    if(inst.type.startsWith('disjuntor')){ inst.props.ligado=!inst.props.ligado; }
    else if(inst.type==='chave-selectora'){ inst.props.on=!inst.props.on; }
    else { return; }
    renderComp(inst); onChangeCb();
  }

  function terminalState(inst, term){
    // terminal vermelho somente quando está em um caminho com corrente real;
    // sinaleiros preservam a aparência neutra e mostram apenas a cor escolhida.
    if(inst.type==='lampada-piloto') return {color:'#222'};
    const cur = window.__NET_STATE__ && window.__NET_STATE__['current:'+inst.id+':'+term.id];
    if(simRunning && cur) return {color:CURRENT_COLOR};
    return {color:'#222'};
  }


  // ---------- SÍMBOLOS (IEC 60617 / NBR 12522) ----------
  const L=(x1,y1,x2,y2,c,sw,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}"${d?' stroke-dasharray="4,3"':''}/>`;
  function contactSym(x,y0,y1,nc,closed,c,sw){
    const m=(y0+y1)/2,a=m-14,b=m+14;
    return L(x,y0,x,a,c,sw)+L(x,b,x,y1,c,sw)+L(x,b,closed?x:x-10,a,c,sw)+(nc?L(x-7,a,x+7,a,c,sw):'');
  }
  function renderSym(def,inst,w,h,stroke,sw){
    const t=def.type,p=inst.props,NS=window.__NET_STATE__||{};
    const cur=simRunning&&NS['current:'+inst.id];
    const c=cur?CURRENT_COLOR:stroke;
    const tag=(x,y,a)=>p.tag?`<text x="${x}" y="${y}" text-anchor="${a||'end'}" font-size="10.5" font-weight="700" fill="${c}" font-family="Roboto Condensed">-${p.tag}</text>`:'';
    const head=(x,m)=>L(x-2,m,x-24,m,c,1.2,1)+L(x-24,m-8,x-24,m+8,c,sw)+L(x-24,m-8,x-30,m-8,c,sw)+L(x-24,m,x-30,m,c,sw)+L(x-24,m+8,x-30,m+8,c,sw);
    if(t.startsWith('src-')){
      return `<circle cx="20" cy="22" r="6" fill="#fff" stroke="${c}" stroke-width="${sw}"/>${L(20,28,20,h,c,sw)}
        <text x="20" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="${c}" font-family="Roboto Condensed">${def.srcPot==='24V'?'+24V':def.srcPot}</text>`;
    }
    if(def.poles){
      const on=p.ligado,n=def.poles; let s=''; const x0=GRID, xe=(2*n-1)*GRID, qx=-30, bx0=x0-20, bw=n*40;
      for(let i=0;i<n;i++){ const x=(1+2*i)*GRID; s+=L(x,0,x,18,c,sw)+L(x,46,x,56,c,sw)+L(x,46,on?x:x-12,on?18:20,c,sw); }
      // acionamento manual (-Q) e ligação mecânica tracejada
      s+=L(qx+11,34,xe-5,34,c,1.2,1);
      s+=L(qx-20,23,qx-20,45,c,sw)+L(qx-20,34,qx-11,34,c,sw)+`<rect x="${qx-11}" y="23" width="22" height="22" fill="none" stroke="${c}" stroke-width="${sw}"/>`+L(qx,23,qx,45,c,sw)+L(qx-11,34,qx+11,34,c,sw);
      s+=L(qx,45,qx,77,c,1.2,1)+L(qx,63,bx0,63,c,1.2,1)+L(qx,77,bx0,77,c,1.2,1);
      // bloco de proteção termomagnética (térmico + magnético por polo)
      s+=`<rect x="${bx0}" y="56" width="${bw}" height="28" fill="none" stroke="${c}" stroke-width="${sw}"/>`+L(bx0,70,bx0+bw,70,c,sw);
      for(let i=1;i<n;i++) s+=L(bx0+40*i,56,bx0+40*i,84,c,sw);
      for(let i=0;i<n;i++){ const x=(1+2*i)*GRID;
        s+=`<path d="M ${x} 56 L ${x} 60 L ${x+10} 60 L ${x+10} 66 L ${x} 66 L ${x} 70" fill="none" stroke="${c}" stroke-width="${sw}"/>`
          +L(x,70,x,100,c,sw)+`<text x="${x+3}" y="81" font-size="11" font-weight="700" fill="${c}" font-family="Roboto Condensed">&gt;</text>`; }
      return s+tag(qx-24,38,'end');
    }
    switch(t){
      case 'motor-trifasico':{
        const cx=60,cy=76,r=34;
        return L(40,0,40,47,c,sw)+L(60,0,60,42,c,sw)+L(80,0,80,47,c,sw)+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" fill-opacity="0" stroke="${c}" stroke-width="${sw}"/>
          <text x="${cx}" y="${cy}" text-anchor="middle" font-size="18" font-weight="700" fill="${c}" font-family="Roboto Condensed">M</text>
          <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11" fill="${c}" font-family="Roboto Condensed">3~</text>${L(cx+r,74,w,74,c,sw)}<path d="M ${w-6} 68 L ${w-6} 80" stroke="${c}"/>${tag(cx-r-6,cy,'end')}`;}
      case 'botao-na': case 'botao-nf':{
        const nc=t==='botao-nf', x=60, m=40, a=26, b=54, pr=!!p.pressed;
        let s=L(x,0,x,a,c,sw)+L(x,b,x,80,c,sw), tipx, tipy;
        if(!nc){ tipx=pr?x:x-10; tipy=a; }
        else { s+=L(x,a,x+10,a,c,sw); tipx=pr?x-10:x+17; tipy=pr?a:a-6; }
        s+=L(x,b,tipx,tipy,c,sw);
        const xm=x+(tipx-x)*((b-m)/(b-tipy));
        s+=L(xm,m,x-30,m,c,1.2,1)+`<text x="${x-40}" y="${m+6}" text-anchor="middle" font-size="16" fill="${c}" font-family="Roboto Condensed">E</text>`;
        return s+tag(x+14,m+4,'start');}
      case 'chave-selectora':
        return contactSym(60,0,80,false,!!p.on,c,sw)+L(58,40,36,40,c,1.2,1)+L(36,32,36,48,c,sw)+tag(28,44,'end');
      case 'bobina-contator':
        return L(60,0,60,25,c,sw)+L(60,55,60,80,c,sw)+`<rect x="40" y="25" width="40" height="30" fill="${cur?CURRENT_COLOR+'22':'#fff'}" stroke="${c}" stroke-width="${sw}"/>`+tag(34,44,'end');
      case 'contato-na': case 'contato-nf':{
        const nc=t==='contato-nf', cl=!!(simRunning&&window.__COILS__&&window.__COILS__[(p.tag||'').trim()]);
        const x=60,a=26,b=54,m=40; let s;
        if(!nc) s=L(x,0,x,a,c,sw)+L(x,b,x,80,c,sw)+(cl? L(x,b,x,a,c,sw) : L(x,b,x+13,a+6,c,sw));
        else s=L(x,0,x,36,c,sw)+L(x,52,x,80,c,sw)+L(x,36,x+12,36,c,sw)+(cl? L(x,52,x-10,40,c,sw) : L(x,52,x+12,31,c,sw));
        return s+tag(x-14,m+4,'end');}
      case 'contato-potencia':{
        const cl=!!(simRunning&&window.__COILS__&&window.__COILS__[(p.tag||'').trim()]); let s='';
        for(let i=0;i<3;i++){ const x=(1+2*i)*GRID; s+=L(x,0,x,26,c,sw)+L(x,54,x,80,c,sw)+(cl?L(x,54,x,26,c,sw):L(x,54,x+13,32,c,sw)); }
        return s+L(-2,40,108,40,c,1.2,1)+tag(-6,44,'end');}
      case 'buzzer':{
        const on=cur, col=on?CURRENT_COLOR:c;
        return L(0,50,19,50,col,sw)+L(19,50,19,28,col,sw)+L(61,28,61,50,col,sw)+L(61,50,80,50,col,sw)
          +`<path d="M 8 4 H 72 A 32 32 0 0 1 8 4 Z" fill="${on?CURRENT_COLOR+'55':'none'}" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" style="${on?'filter:drop-shadow(0 0 4px '+CURRENT_GLOW+')':''}"/>`;}
      case 'potenciometro':{
        const v=p.value||0, pts=[[40,20],[32,25],[48,35],[32,45],[48,55],[32,65],[48,75],[40,80]].map(q=>q.join(',')).join(' ');
        return L(40,0,40,20,c,sw)+L(40,80,40,100,c,sw)+`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="miter"/>`
          +L(80,50,56,50,c,sw)+`<path d="M 49 50 L 59 45 L 59 55 Z" fill="${c}" stroke="${c}" stroke-width="1"/>`
          +`<text x="58" y="94" font-size="9" fill="${c}" font-family="JetBrains Mono">${v.toFixed(1)}V</text>`;}
      case 'temporizador-bobina':{
        // Bobina KT em duas seções: X na seção esquerda no modo ON-delay,
        // seção esquerda vazia no OFF-delay; A1/A2 na seção direita.
        const onMode = p.mode!=='off';
        return L(60,0,60,26,c,sw)+L(60,54,60,80,c,sw)
          +`<rect x="22" y="26" width="56" height="28" fill="${cur?CURRENT_COLOR+'18':'#fff'}" stroke="${c}" stroke-width="${sw}"/>`
          +L(50,26,50,54,c,sw)
          +(onMode ? L(22,26,50,54,c,sw*0.9)+L(50,26,22,54,c,sw*0.9) : '')
          +tag(18,44,'end');}
      case 'contato-temporizado-na': case 'contato-temporizado-nf':{
        const nc=t==='contato-temporizado-nf';
        const st=simRunning&&window.__TIMERS__&&window.__TIMERS__[(p.tag||'').trim()];
        const done=!!(st&&st.done);
        const closed=nc?!done:done;
        const x=60, a=24, b=56, m=40;
        let s=L(x,0,x,a,c,sw)+L(x,b,x,80,c,sw);
        if(nc) s+=L(x,a,x+12,a,c,sw);
        s+=L(x,b,closed?x:(nc?x-12:x+12),a,c,sw);
        s+=`<path d="M ${x-8} ${a+3} Q ${x-22} ${m} ${x-8} ${b-3}" fill="none" stroke="${c}" stroke-width="${sw*0.9}" stroke-linecap="round"/>`;
        return s+tag(34,44,'end');}
      case 'contato-temporizado-na-nf':{
        const st=simRunning&&window.__TIMERS__&&window.__TIMERS__[(p.tag||'').trim()];
        const done=!!(st&&st.done);
        let s=L(60,0,60,22,c,sw)
          +L(40,80,40,58,c,sw)+L(40,58,50,58,c,sw)
          +L(80,80,80,58,c,sw)+L(70,58,80,58,c,sw)
          +`<circle cx="60" cy="22" r="2.2" fill="${c}"/>`
          +L(60,22,done?72:48,56,c,sw)
          +`<path d="M 52 26 Q 38 40 52 54" fill="none" stroke="${c}" stroke-width="${sw*0.9}" stroke-linecap="round"/>`;
        return s+tag(30,44,'end');}
      case 'lampada-piloto':{
        // Acende com a cor definida no inspetor; o caminho de corrente não altera a cor.
        const on=!!(simRunning&&NS['glow:'+inst.id]);
        const lampColor=p.color||'#e5484d';
        const col=on?lampColor:stroke;
        const tagHtml=p.tag?`<text x="40" y="48" text-anchor="end" font-size="10.5" font-weight="700" fill="${stroke}" font-family="Roboto Condensed">-${p.tag}</text>`:'';
        return L(60,0,60,26,stroke,sw)+L(60,54,60,80,stroke,sw)+`<circle cx="60" cy="40" r="14" fill="${on?lampColor+'55':'#fff'}" stroke="${col}" stroke-width="${sw}" style="${on?'filter:drop-shadow(0 0 6px '+lampColor+')':''}"/>`
          +L(50,30,70,50,col,sw)+L(50,50,70,30,col,sw)+tagHtml;}

    return null;
  }

  function renderBody(def, inst, w, h, isSel){
