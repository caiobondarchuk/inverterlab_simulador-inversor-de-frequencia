      paramsEl.innerHTML = INV_PANEL_QUICK_PARAMS.map(code=>{
        const p = PARAMS[code];
        const val = p.enum ? (p.enum.find(e=>e.v===p.val)?.l || p.val) : (p.val+(p.unit?' '+p.unit:''));
        return `<div class="ip-param-row" data-code="${code}" style="display:flex;justify-content:space-between;gap:8px;padding:7px 4px;
          border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12px;">
          <span style="color:var(--accent);font-family:var(--mono);width:52px;flex-shrink:0;">${code}</span>
          <span style="color:var(--text-dim);flex:1;">${p.name}</span>
          <span style="color:var(--text);font-family:var(--mono);">${val}</span>
        </div>`;
      }).join('');
      paramsEl.querySelectorAll('.ip-param-row').forEach(row=>{
        row.addEventListener('mouseenter',()=>row.style.background='var(--panel-2)');
        row.addEventListener('mouseleave',()=>row.style.background='');
        row.addEventListener('click', ()=>{ IHM.openParamEditor(row.dataset.code); });
      });
      document.getElementById('ip-close').addEventListener('click', close);
      document.getElementById('ip-done').addEventListener('click', close);
      const runBtn = document.getElementById('ip-run');
      if(runBtn) runBtn.addEventListener('click', ()=>{ if(inverter){ inverter.setRunFromPanel(true,1); draw(); } });
      const stopBtn = document.getElementById('ip-stop');
      if(stopBtn) stopBtn.addEventListener('click', ()=>{ if(inverter){ if(inverter.fault) inverter.clearFault(); inverter.setRunFromPanel(false); draw(); } });
      const jogBtn = document.getElementById('ip-jog');
      if(jogBtn) jogBtn.addEventListener('click', ()=>{ if(inverter){ inverter.setRunFromPanel(true,1); toast('JOG: pulso de teste','ok'); draw(); } });
      const resetBtn = document.getElementById('ip-reset-fault');
      if(resetBtn) resetBtn.addEventListener('click', ()=>{ if(inverter){ inverter.clearFault(); draw(); } });
    }
    function close(){ window.__IP_LIVE__=null; document.getElementById('modal-backdrop').classList.remove('open'); }
    draw();
    document.getElementById('modal-backdrop').classList.add('open');
    window.__IP_LIVE__=live;
  }

  // ---------------- MENU / EVENTOS GLOBAIS ----------------
  function wireMenus(){
    document.querySelectorAll('.menu-item').forEach(item=>{
      const btn = item.querySelector('.menu-btn');
      const dd = item.querySelector('.dropdown');
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        document.querySelectorAll('.dropdown').forEach(d=>{ if(d!==dd) d.classList.remove('open'); });
        dd.classList.toggle('open');
      });
    });
    window.addEventListener('click', ()=> document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('open')));

    document.getElementById('dd-arquivo').addEventListener('click', e=>{
      const act = e.target.closest('button')?.dataset.act; if(!act) return;
      const editActs = ['novo','abrir'];
      if(editActs.includes(act) && running){ toast('Pare a simulação para usar essa ação','warn'); return; }
      if(act==='novo'){ if(confirm('Limpar bancada e iniciar novo projeto?')){ CircuitEditor.clearAll(); toast('Novo projeto criado','ok'); } }
      if(act==='abrir'){ document.getElementById('file-input').click(); }
      if(act==='salvar'){ saveProject(); }
      if(act==='exemplos'){ showExamplesModal(); }
      if(act==='exportar-png'){ exportSvg(); }
    });
    document.getElementById('dd-editar').addEventListener('click', e=>{
      const act = e.target.closest('button')?.dataset.act; if(!act) return;
      if(running){ toast('Pare a simulação para editar a bancada','warn'); return; }
      if(act==='desfazer') CircuitEditor.undo();
      if(act==='refazer') CircuitEditor.redo();
      if(act==='duplicar') CircuitEditor.duplicateSelected();
      if(act==='excluir') CircuitEditor.deleteSelected();
      if(act==='limpar-fios') CircuitEditor.clearWires();
      if(act==='limpar-tudo'){ if(confirm('Remover tudo da bancada?')) CircuitEditor.clearAll(); }
    });
    document.getElementById('dd-ver').addEventListener('click', e=>{
      const act = e.target.closest('button')?.dataset.act; if(!act) return;
      if(act==='rotulos') CircuitEditor.toggleLabels();
      if(act==='grade'){ CircuitEditor.toggleGrid(); renderQuickbar(); }
      if(act==='zoom-reset') CircuitEditor.resetZoom();
      if(act==='ajuda') showHelpModal();
      if(act==='creditos') showCreditsModal();
    });
    document.getElementById('file-input').addEventListener('change', e=>{
      if(running){ toast('Pare a simulação para abrir um arquivo','warn'); e.target.value=''; return; }
      if(e.target.files[0]) openProjectFile(e.target.files[0]);
      e.target.value='';
    });
    document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=>switchView(b.dataset.view)));
    document.getElementById('modal-backdrop').addEventListener('click', e=>{
      if(e.target.id==='modal-backdrop'){ window.__IP_LIVE__=null; e.currentTarget.classList.remove('open'); }
    });
    document.getElementById('manual-backdrop').addEventListener('click', e=>{
      if(e.target.id==='manual-backdrop') IHM.closeManualModal();
    });
    window.addEventListener('keydown', e=>{
      if(e.key==='Escape'){
        const mb = document.getElementById('manual-backdrop');
        if(mb && mb.classList.contains('open')){ IHM.closeManualModal(); return; }
      }
      if(e.ctrlKey && e.key==='s'){ e.preventDefault(); saveProject(); }
      if(e.ctrlKey && e.key==='o'){ e.preventDefault(); if(running){ toast('Pare a simulação para abrir um arquivo','warn'); return; } document.getElementById('file-input').click(); }
      if(e.key==='F1'){ e.preventDefault(); showHelpModal(); }
    });
  }
  function exportSvg(){
    const svg = document.getElementById('ce-svg');
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const s = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([s], {type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='inverterlab-circuito.svg'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('SVG exportado','ok');
  }

  // ---------------- TEMA (claro padrão / escuro) ----------------
  function wireThemeToggle(){
    const btn = document.getElementById('theme-toggle');
    const label = document.getElementById('theme-label');
    btn.addEventListener('click', ()=>{
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur==='dark' ? 'light' : 'dark';
      if(next==='dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
      label.textContent = next==='dark' ? 'Escuro' : 'Claro';
      CircuitEditor.refreshAll();
    });
  }

  // ---------------- INIT ----------------
  function init(){
    wireThemeToggle();
    CircuitEditor.init(document.getElementById('view-bancada'));
    const miClose = document.getElementById('mi-close');
    if(miClose) miClose.addEventListener('click', ()=>{
      miCollapsed = true;
      syncMotorInspector();
    });
    const miTab = document.getElementById('mi-tab');
    if(miTab) miTab.addEventListener('click', ()=>{
      miCollapsed = false;
      syncMotorInspector();
    });
    CircuitEditor.onChange = ()=>{ /* poderia auto-salvar */ };
    CircuitEditor.onSelect = ()=>{};
    CircuitEditor.onMotorParamChange = (code, val)=>{
      if(motor) motor.updateFromParams(PARAMS);
    };
    CircuitEditor.onOpenInverterPanel = (inst)=>{ showInverterPanelModal(inst); };
    wireMenus();
    NetworkSolver.reset();
    NetworkSolver.solve(CircuitEditor.instances, CircuitEditor.wires, 0);
    renderQuickbar();
    toast('Bem-vindo! Arraste componentes da paleta para montar seu circuito.','ok');
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>

rcuito de comando.":"Frequency drive — the heart of the system. With the drive powered, the 24V/COM terminals supply +24VDC to the control circuit.","Pratique montagens típicas de acionamento com o inversor de frequência. Cada exercício verifica automaticamente se o objetivo foi atingido na bancada.":"Practice typical drive assemblies with the frequency inverter. Each exercise automatically checks whether the goal was achieved on the workbench.","Adicione: as alimentações L1, L2 e L3, o Disjuntor Tripolar, o Inversor de Frequência e o Motor Trifásico.":"Add: the L1, L2 and L3 supplies, the Three-Pole Circuit Breaker, the Frequency Inverter and the Three-Phase Motor.","• InverterLab — projeto educacional não oficial, baseado em inversores de frequência. Desenvolvido por Caio Bondarchuk e Breno Rossi.":"• InverterLab — unofficial educational project, based on frequency inverters. Developed by Caio Bondarchuk and Breno Rossi.","Simulador educacional de inversores de frequência.":"Educational frequency inverter simulator.","Bobina de relé temporizado (A1/A2). Modo ON-delay: o contato temporizado atua após o tempo ajustado com a bobina energizada. Modo OFF-delay: o contato permanece atuado por mais o tempo ajustado após a bobina desenergizar.":"Timed relay coil (A1/A2). ON-delay mode: the timed contact operates after the set time with the coil energized. OFF-delay mode: the contact remains operated for the set time after the coil is de-energized.","Contato NA temporizado (1/2) que acompanha o temporizador da mesma TAG. Fecha quando o temporizador atua.":"Timed NO contact (1/2) that follows the timer with the same TAG. Closes when the timer operates.","Contato NF temporizado (3/4) que acompanha o temporizador da mesma TAG. Abre quando o temporizador atua.":"Timed NC contact (3/4) that follows the timer with the same TAG. Opens when the timer operates.","Contato comutador temporizado (15 comum, 16 NF, 18 NA) que acompanha o temporizador da mesma TAG. Em repouso fecha 15–16; quando o temporizador atua, fecha 15–18.":"Timed changeover contact (15 common, 16 NC, 18 NO) that follows the timer with the same TAG. At rest it closes 15–16; when the timer operates, it closes 15–18.","Horário":"Clockwise","Anti-horário":"Counter-clockwise","Seleção múltipla":"Multiple selection","Ctrl+clique adiciona ou remove itens da seleção. Arraste um componente selecionado para mover o grupo. Del exclui tudo.":"Ctrl+click adds or removes items from the selection. Drag a selected component to move the group. Del deletes everything.","Duplicar componentes (Ctrl+D)":"Duplicate components (Ctrl+D)","Excluir seleção (Del)":"Delete selection (Del)","Limpar seleção":"Clear selection","Arraste componentes da paleta • Arraste de um terminal a outro para ligar (fios ortogonais) • Ctrl+clique seleciona vários componentes/fios • Arraste um item selecionado para mover o grupo • Del exclui a seleção • Solte sobre um fio para emendar (ou clique duas vezes no fio) • Contatos seguem a bobina/temporizador da mesma TAG":"Drag components from the palette • Drag from one terminal to another to connect (orthogonal wires) • Ctrl+click selects multiple components/wires • Drag a selected item to move the group • Del deletes the selection • Drop onto a wire to splice (or double-click the wire) • Contacts follow the coil/timer with the same TAG","Ctrl+clique":"Ctrl+click","adiciona/remove componentes e fios da seleção. Arraste um item selecionado para mover o grupo inteiro.":"adds/removes components and wires from the selection. Drag a selected item to move the entire group.","duplica os componentes selecionados (e os fios internos entre eles).":"duplicates the selected components (and the internal wires between them).","O inspetor aparece somente quando há algo selecionado e mostra as propriedades do item ou o resumo da seleção múltipla.":"The inspector appears only when something is selected and shows the item properties or the multiple-selection summary.","exclui todos os itens selecionados (só com simulação parada).":"deletes all selected items (only while the simulation is stopped).","Durante a simulação, somente fios, terminais e componentes percorridos por corrente real ficam vermelhos. O indicador da bancada mostra o estado, a frequência e o sentido de rotação (horário/anti-horário).":"During simulation, only wires, terminals and components carrying real current turn red. The workbench indicator shows the state, frequency and rotation direction (clockwise/counter-clockwise)."};

  });
  const RULES = [
  [/^(\d+) componente\(s\) · (\d+) fio\(s\)$/, m=>(m[1]+' component(s) · '+m[2]+' wire(s)')],
  [/^Cor dos (\d+) fios selecionados$/, m=>('Color of selected wires ('+m[1]+')')],
  [/^Velocidade: (.+)$/, m=>('Speed: '+m[1])],
  [/^Frequência: (.+)$/, m=>('Frequency: '+m[1])],
  [/^Sentido: (.+)$/, m=>('Direction: '+T(m[1]))],
  [/^Referência completa de parâmetros — (\d+) parâmetros em (\d+) grupos\. Consulte faixas, padrão de fábrica, opções e descrições\.$/, m=>('Complete parameter reference — '+m[1]+' parameters in '+m[2]+' groups. See ranges, factory defaults, options, and descriptions.')],
  [/^Rodando — (.+) Hz · (Horário|Anti-horário)$/, m=>('Running — '+m[1]+' Hz · '+T(m[2]))],
  [/^Parado — (.+) Hz · (Horário|Anti-horário)$/, m=>('Stopped — '+m[1]+' Hz · '+T(m[2]))],
  [/^Parâmetros restaurados de fábrica \((\d+) alterados\)\. Parâmetros do motor mantidos\.$/, m=>('Factory parameters restored ('+m[1]+' changed). Motor parameters kept.')],
  [/^Auto-ajuste (estático|rotativo) concluído \(simulado\)$/, m=>('Auto-tuning ('+(m[1]==='estático'?'static':'rotating')+') completed (simulated)')],
  [/^(P\d-\d\d|[A-Z]\d-\d\d) é somente leitura$/, m=>(m[1]+' is read-only')],
  [/^(.+) adicionado$/, m=>(T(m[1])+' added')],
  [/^Exemplo carregado: (.+)$/, m=>('Example loaded: '+T(m[1]))],
  [/^Rodando — (.+)$/, m=>('Running — '+m[1])],
  [/^Carga: (.+)$/, m=>('Load: '+m[1])],
  [/^Bobina: (energizada|desenergizada)$/, m=>('Coil: '+(m[1]==='energizada'?'energized':'de-energized'))],
  [/^Contato: (atuado|repouso)$/, m=>('Contact: '+(m[1]==='atuado'?'actuated':'rest'))],
  [/^Tempo: (.+)$/, m=>('Time: '+m[1])],
  [/^(.+) atualizado(.*)$/, m=>(m[1]+' updated'+m[2])],
  [/^Em operação · sentido (.+)$/, m=>('Running · direction '+m[1])],
  [/^FALHA (.+)$/, m=>('FAULT '+T(m[1]))],
  [/^Terminal de alimentação (.+?)\. Adicione uma fase por vez\.$/, m=>('Power supply terminal '+T(m[1])+'. Add one phase at a time.')]
  ];
  let lang='en'; try{ lang=localStorage.getItem('simlang')||'en'; }catch(e){}
  const norm=s=>String(s).replace(/\s+/g,' ').trim();
  function T(s){
    const k=norm(s);
    if(Object.prototype.hasOwnProperty.call(EN,k)) return EN[k];
    for(const [re,fn] of RULES){ const m=k.match(re); if(m) return fn(m); }
    if(k.indexOf(' — ')>0){ let ch=false; const out=k.split(' — ').map(p=>{ const t=T(p); if(t!==p) ch=true; return t; }); if(ch) return out.join(' — '); }
    return k;
  }
  const orig=new WeakMap(), origA=new WeakMap();
  function tnode(n){
    const v=n.nodeValue; if(!v||!/\S/.test(v)) return;
    const p=n.parentNode; if(p&&(p.nodeName==='SCRIPT'||p.nodeName==='STYLE')) return;
    const rec=orig.get(n);
    if(lang==='en'){
      if(rec&&v===rec.en) return;
      const k=norm(v), en=T(v);
      if(en!==k){ const out=v.match(/^\s*/)[0]+en+v.match(/\s*$/)[0]; orig.set(n,{pt:v,en:out}); n.nodeValue=out; }
    } else if(rec){ if(v===rec.en) n.nodeValue=rec.pt; orig.delete(n); }
  }
  function tattr(el,a){
    const v=el.getAttribute(a); if(!v) return;
    let m=origA.get(el); if(!m){ m={}; origA.set(el,m); }
    const rec=m[a];
    if(lang==='en'){ if(rec&&v===rec.en) return; const en=T(v); if(en!==norm(v)){ m[a]={pt:v,en:en}; el.setAttribute(a,en); } }
    else if(rec){ if(v===rec.en) el.setAttribute(a,rec.pt); delete m[a]; }
  }
  function walk(root){
    if(root.nodeType===3){ tnode(root); return; }
    if(root.nodeType!==1) return;
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=tw.nextNode())) tnode(n);
    ['title','placeholder'].forEach(a=>{ if(root.hasAttribute(a)) tattr(root,a); });
    root.querySelectorAll('[title],[placeholder]').forEach(e=>{ tattr(e,'title'); tattr(e,'placeholder'); });
  }
  const mo=new MutationObserver(ms=>{ ms.forEach(m=>{
    if(m.type==='childList') m.addedNodes.forEach(walk);
    else if(m.type==='characterData') tnode(m.target);
    else if(m.type==='attributes') tattr(m.target,m.attributeName);
  }); });
  const OPTS={childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder']};
  const _cf=window.confirm.bind(window), _al=window.alert.bind(window);
  window.confirm=m=>_cf(lang==='en'?T(m):m); window.alert=m=>_al(lang==='en'?T(m):m);
  function setLang(l){
    lang=l; try{ localStorage.setItem('simlang',l); }catch(e){}
    document.documentElement.lang = l==='en'?'en':'pt-BR';
    document.querySelectorAll('#lang-toggle .lg').forEach(s=>s.classList.toggle('on',s.dataset.l===l));
    mo.disconnect(); walk(document.body);
    if(l==='en') mo.observe(document.body,OPTS);
  }
  const btn=document.getElementById('lang-toggle');
  if(btn) btn.addEventListener('click',()=>setLang(lang==='en'?'pt':'en'));
  window.SimLang={set:setLang,get:()=>lang,T:T};
  setLang(lang);
})();
